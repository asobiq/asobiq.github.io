/* ---------- タップ移動 ---------- */
let autoPath=[], autoTimer=null, lastTouchT=0;
function cancelAuto(){ autoPath.length=0; if(autoTimer){clearTimeout(autoTimer);autoTimer=null;} }
function stepAuto(){
  autoTimer=null;
  if(!autoPath.length||busy||won){autoPath.length=0;return;}
  const st=autoPath.shift();
  const ex=player.x+st[0], ey=player.y+st[1];
  tryMove(st[0],st[1]);
  if(player.x!==ex||player.y!==ey){autoPath.length=0;return;}  // 予定通り動けなければ中断
  if(autoPath.length) autoTimer=setTimeout(stepAuto,110);
}
function tapMove(tx,ty){
  if(busy||won) return;
  if(tx<0||ty<0||tx>=W||ty>=H) return;
  cancelAuto();
  const b=boulderAt(tx,ty);
  if(b){
    if(breaksLeft>0) return;   // 岩タップは既存の「壊す」(el.onclick)に任せる
    const dx=tx-player.x, dy=ty-player.y;
    if(Math.abs(dx)+Math.abs(dy)===1) tryMove(dx,dy);   // 隣の岩タップ=押す
    return;
  }
  if(breakMode){ breakMode=false; updateBreakUI(); return; }
  if(tx===player.x&&ty===player.y) return;
  // 歩けるマスだけでBFS(岩は押さない)。壁/穴/刃/岩は通れない
  const pass=(x,y)=>{
    if(x<0||y<0||x>=W||y>=H)return false;
    const t=grid[y][x];
    if(t===WALL||t===HOLE||t===BLADE)return false;
    return !boulderAt(x,y);
  };
  if(!pass(tx,ty))return;
  const prev=new Map([[player.x+','+player.y,null]]);
  const q=[[player.x,player.y]]; let head=0,found=false;
  while(head<q.length){
    const c=q[head++];
    if(c[0]===tx&&c[1]===ty){found=true;break;}
    for(const d of [[0,-1],[0,1],[-1,0],[1,0]]){
      const nx=c[0]+d[0],ny=c[1]+d[1],k=nx+','+ny;
      if(!pass(nx,ny)||prev.has(k))continue;
      prev.set(k,[c[0],c[1],d[0],d[1]]); q.push([nx,ny]);
    }
  }
  if(!found)return;
  const steps2=[]; let k=tx+','+ty;
  while(prev.get(k)){ const p=prev.get(k); steps2.push([p[2],p[3]]); k=p[0]+','+p[1]; }
  autoPath=steps2.reverse();
  stepAuto();
}
function boardCellFromPoint(cx,cy){
  const rect=board.getBoundingClientRect();
  return [Math.floor((cx-rect.left)/T), Math.floor((cy-rect.top)/T)];
}

let ts=null;
board.parentElement.addEventListener('touchstart',e=>{ts={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
board.parentElement.addEventListener('touchend',e=>{
  if(!ts)return;
  const dx=e.changedTouches[0].clientX-ts.x, dy=e.changedTouches[0].clientY-ts.y;
  ts=null;
  lastTouchT=Date.now();
  if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;   // タップ移動は不評につき無効化(tapMoveは温存)
  cancelAuto();
  if(Math.abs(dx)>Math.abs(dy)) tryMove(dx>0?1:-1,0);
  else tryMove(0,dy>0?1:-1);
});
function relayout(){
  if(!player || !player.el) return;   // 盤面未ロード(Web案内画面)では何もしない
  const oldT=T; fitTiles();
  if(T===oldT)return;
  board.style.width=W*T+'px'; board.style.height=H*T+'px';
  board.querySelectorAll('.tile').forEach(t=>{
    t.style.width=T+'px';t.style.height=T+'px';
    t.style.left=t.dataset.x*T+'px';t.style.top=t.dataset.y*T+'px';
  });
  boulders.forEach(b=>{sizeEnt(b.el);place(b.el,b.x,b.y);});
  sizeEnt(player.el);place(player.el,player.x,player.y);
}

      +'<span class="tDesc">'+meta[1]+'</span>'
      +'<span class="swatch">'+sw+'</span>'
      +(theme===name?'<span class="tCheck">✓</span>':'');
    card.onclick=()=>{ applyTheme(name); buildThemeGrid(); setTimeout(closeThemePicker,180); };
    grid.appendChild(card);
  });
}
function openThemePicker(){ buildThemeGrid(); themePickerEl.classList.add('show'); }
function closeThemePicker(){ themePickerEl.classList.remove('show'); }
document.getElementById('themeBtn').onclick=openThemePicker;
document.getElementById('themeClose').onclick=closeThemePicker;
themePickerEl.onclick=(e)=>{ if(e.target===themePickerEl) closeThemePicker(); };

/* ---------- あそびかた(ヘルプ) ---------- */
const helpPickerEl=document.getElementById('helpPicker');
function buildHelp(){
  const t=TX();
  const c=document.getElementById('helpContent');
  c.innerHTML='';
  const secs=[[t.helpSecBasics,'basics'],[t.helpSecGimmicks,'gimmicks'],[t.helpSecModes,'modes']];
  secs.forEach(([label,key])=>{
    const h=document.createElement('div');
    h.className='helpSection';
    h.textContent='── '+label+' ──';
    c.appendChild(h);
    t.helpItems[key].forEach(it=>{
      const row=document.createElement('div');
      row.className='helpItem';
      row.innerHTML='<div class="hIcon">'+it[0]+'</div>'
        +'<div><div class="hName">'+it[1]+'</div><div class="hDesc">'+it[2]+'</div></div>';
      c.appendChild(row);
    });
  });
}
function openHelp(){ buildHelp(); helpPickerEl.classList.add('show'); }
function closeHelp(){ helpPickerEl.classList.remove('show'); }
document.getElementById('helpBtn').onclick=openHelp;
document.getElementById('helpClose').onclick=closeHelp;
helpPickerEl.onclick=(e)=>{ if(e.target===helpPickerEl) closeHelp(); };

/* ---------- キャラ選択 ---------- */
const charPickerEl=document.getElementById('charPicker');
function buildCharGrid(){
  const grid=document.getElementById('charGrid');
  const t=TX();
  grid.innerHTML='';
  CHARACTERS.forEach(c=>{
    const unlocked=charUnlocked(c);
    const card=document.createElement('button');
    card.className='charCard'+(character===c.id?' sel':'')+(unlocked?'':' locked');
    const preview='<div class="preview"><div class="player '+c.cls+'">'+playerInnerHTML(c.id)+'</div></div>';
    if(unlocked){
      card.innerHTML=preview+'<span class="cName">'+t.charNames[c.id]+'</span>';
      card.onclick=()=>{ character=c.id; saveProgress(); refreshPlayerLook(); updateCharButton(); buildCharGrid(); };
    }else{
      card.innerHTML='<div class="preview" style="filter:grayscale(1) brightness(.5)">'+preview.replace('<div class="preview">','').replace(/<\/div>$/,'')+'</div><span class="cLock">🔒 '+t.charLock(c.need)+'</span>';
      card.onclick=null;
    }
    grid.appendChild(card);
  });
}
// 現在表示中のプレイヤー駒の見た目を更新
function refreshPlayerLook(){
  if(player && player.el){
    player.el.className='ent player '+charClass();
    player.el.innerHTML=playerInnerHTML(character);
  }
  updateCharButton();
}
function openCharPicker(){ buildCharGrid(); charPickerEl.classList.add('show'); }
function closeCharPicker(){ charPickerEl.classList.remove('show'); }
document.getElementById('charBtn2')&&(document.getElementById('charBtn2').onclick=openCharPicker);
document.getElementById('charClose').onclick=closeCharPicker;
charPickerEl.onclick=(e)=>{ if(e.target===charPickerEl) closeCharPicker(); };

/* ---------- エンドレス開始 & 進捗保存(localStorage) ---------- */
document.getElementById('endlessStart').onclick=()=>{ closePicker(); audio(); startEndless(); };

const SAVE_KEY='kyoseki_save_v1';
// ステージ盤面のシグネチャ。マップ差し替え時にクリア記録/ベストを自動リセットするために保存する
function levelSig(i){
  const L=LEVELS[i]; if(!L) return 0;
  const s=L.map.join('|')+'/'+(L.par||0)+'/'+(L.breaks||0)+'/'+(L.slide?1:0);
  let h=0; for(let k=0;k<s.length;k++){ h=(h*31+s.charCodeAt(k))|0; }
  return h;
}
function saveProgress(){
  try{
    const sigs={}; for(const i of cleared) sigs[i]=levelSig(i);
    const data={
      cleared:[...cleared], bestSteps, endlessBest, sigs,
      endlessRecord: Math.max(0, ...Object.keys(endlessBest).map(Number), 0),
      lang, theme, character
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadProgress(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const d=JSON.parse(raw);
    if(d.cleared) cleared=new Set(d.cleared);
    if(d.bestSteps) bestSteps=d.bestSteps;
    // マップが差し替えられたステージはクリア記録をリセット(par再隠蔽・ベスト無効化)
    if(d.sigs){
      for(const i of [...cleared]){
        if(d.sigs[i]!==levelSig(i)){ cleared.delete(i); delete bestSteps[i]; }
      }
    } else {
      // 旧形式セーブ: シグネチャ不明のため、差し替え済みステージ(6,46,61,62,65,67,80,83,98)のみリセット
      for(const i of [5,45,60,61,64,66,79,82,97]){ cleared.delete(i); delete bestSteps[i]; }
    }
    // 不可能な記録(ベスト<par)はマップ差し替えの残骸とみなしリセット
    for(const i of [...cleared]){
      if(LEVELS[i] && typeof bestSteps[i]==='number' && bestSteps[i]<LEVELS[i].par){
        cleared.delete(i); delete bestSteps[i];
      }
    }
    if(d.endlessBest) endlessBest=d.endlessBest;
    if(d.lang) lang=d.lang;
    if(d.theme && THEME_ORDER.includes(d.theme)) theme=d.theme;  // 削除済みテーマはretroへフォールバック
    if(d.character) character=d.character;
  }catch(e){}
}

// 保存済み進捗を読み込み(localStorage)
loadProgress();

/* ---------- マイコース(自作コースの端末内保存) ---------- */
const COURSES_KEY='kyoseki_courses_v1';
function getCourses(){
  try{ const raw=localStorage.getItem(COURSES_KEY); return raw?JSON.parse(raw):[]; }catch(e){ return []; }
}
function saveCourse(course){
  // course = {name, map, breaks, slide, par}
  try{
    const list=getCourses();
    course.id = 'c'+Date.now();
    list.push(course);
    localStorage.setItem(COURSES_KEY, JSON.stringify(list));
    return true;
  }catch(e){ return false; }
}
function deleteCourse(id){
  try{
    const list=getCourses().filter(c=>c.id!==id);
    localStorage.setItem(COURSES_KEY, JSON.stringify(list));
  }catch(e){}
}
// ステージ総数をナビに反映(spanは保持してテキストノードだけ更新)
document.getElementById('stagePick').lastChild.textContent=' / '+LEVELS.length;
applyTheme(theme || 'retro');
// URLに共有コースがあればそれを起動。なければ通常ステージ1(公開Webでは案内画面のみ)
if(!checkSharedURL()){
  if(WEB_LOCKED){
    showWebLanding();
  }else{
    loadLevel(0);
    // 初プレイならチュートリアルを表示
    let tutDone=false;
    try{ tutDone = localStorage.getItem('kyoseki_tut_done')==='1'; }catch(e){}
    if(!tutDone) setTimeout(showTutorial, 400);
  }
}else if(WEB_LOCKED){
  applyWebLock();
}
applyLang();
updateCharButton();
// レイアウト確定後に再フィット(初回は高さが未確定なことがあるため)
requestAnimationFrame(relayout);
setTimeout(relayout, 100);

</script>
