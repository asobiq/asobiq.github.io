<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>イワオシ</title>
<!-- フォントは assets/fonts/ に同梱(オフラインでも表示が崩れない) -->
<link href="assets/fonts/fonts.css" rel="stylesheet">
<style>
/* ============================================================
   レトロ版オリジナルUI(デフォルト):root に保持。
   このパレットがゲームの原典。body にテーマクラスを付けない =
   この見た目になる。下部のモダンテーマ群はこの変数を上書きする
   だけで、ゲームロジックには一切手を加えていない。
   ============================================================ */
:root{
  --cave:#221813;
  --cave2:#2e211a;
  --sand:#c9a876;
  --sand2:#b8945f;
  --rockwall:#55402f;
  --rockwall2:#473527;
  --boulder:#9b8b79;
  --rune:#56e0c3;
  --ink:#f3e7d3;
  --accent:#e0a13a;
  /* テーマで差し替える派生トークン(既定=レトロ) */
  --bodyBg: radial-gradient(ellipse at 50% -10%, #3a2a1f 0%, transparent 55%), var(--cave);
  --gameFont: 'DotGothic16', 'Hiragino Kaku Gothic ProN', sans-serif;
  --panel: var(--cave2);
  --panelBorder: #4a3729;
  --boardBg: var(--cave2);
  --boardShadow: 0 0 0 3px #120c08, 0 0 0 6px #4a3729, 0 14px 30px rgba(0,0,0,.6);
  --floorGrad: linear-gradient(135deg,var(--sand) 0%,var(--sand2) 100%);
  --floorInset: inset 0 0 0 1px rgba(0,0,0,.13), inset 0 2px 0 rgba(255,255,255,.12);
  --wallGrad: linear-gradient(160deg,var(--rockwall),var(--rockwall2));
  --wallShadow: inset 0 3px 0 rgba(255,255,255,.07), inset 0 -4px 0 rgba(0,0,0,.3), inset 0 0 0 1px rgba(0,0,0,.25);
  --wallRadius: 3px;
  --holeGrad: radial-gradient(circle at 50% 42%, #000 0%, #0c0805 46%, #241812 66%, var(--sand2) 90%);  /* 縁の砂色を広げて壁と区別しやすく */
  --goalGrad: linear-gradient(135deg,#2a4a42,#1c352f);
  --rockGrad: radial-gradient(circle at 36% 30%, #c2b3a0 0%, var(--boulder) 45%, #6f6052 100%);
  --rockShadow: 0 4px 0 rgba(0,0,0,.35), inset -3px -5px 0 rgba(0,0,0,.18), inset 3px 4px 0 rgba(255,255,255,.18);
  --rockRadius: 46%;
  --fillGrad: radial-gradient(circle at 38% 32%, #8c7c6b, #6b5c4c 70%);
  --headColor:#e8b88c; --hatColor:#b6452f; --eyeColor:#2b1c12;
  --torsoGrad: linear-gradient(#3f6e64,#31564e);
  --tileGap: 0px;
  --boardRadius: 10px;
  --tileRadius: 0px;
  --dimText:#8d7458;
  --stepText:#cdb592;
  --titleShadow: 0 2px 0 #000;
  --boardPad: 0px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background: var(--bodyBg);
  background-attachment: fixed;
  color:var(--ink);
  font-family: var(--gameFont);
  display:flex;flex-direction:column;align-items:center;
  overflow:hidden;
  height:100dvh;
  touch-action:none;
  user-select:none;-webkit-user-select:none;
}
header{
  width:100%;max-width:520px;
  padding:8px 14px 2px;
  display:flex;align-items:flex-start;justify-content:space-between;
  flex:0 0 auto;
}
/* タイトル→ステージ名→ステージ選択を縦積み */
#hdrLeft{display:flex;flex-direction:column;align-items:flex-start;gap:5px;}
h1{
  font-size:22px;letter-spacing:3px;font-weight:normal;
  color:var(--accent);
  text-shadow:var(--titleShadow);
}
#stageName{font-size:12px;color:var(--stepText);letter-spacing:1px;}
#langBtn, #themeBtn, #charBtn2, #helpBtn{
  font-family:inherit;color:var(--ink);background:var(--panel);
  border:2px solid var(--panelBorder);border-radius:8px;padding:4px 10px;
  font-size:12px;cursor:pointer;letter-spacing:1px;
}
/* ヘッダーのボタンを2段グリッドで表示(🎵含め5個=3+2) */
#hdrBtns{display:grid;grid-template-columns:repeat(3,auto);gap:6px;flex:0 0 auto;}
#hdrBtns button{
  width:46px;height:38px;padding:0;position:relative;
  display:flex;align-items:center;justify-content:center;
}
/* 見た目を変えずにタップ領域を44pt相当まで拡張 */
#hdrBtns button::before{content:'';position:absolute;inset:-3px;}
#charBtn2{
  width:48px;height:32px;padding:0;
  display:flex;align-items:center;justify-content:center;
}
#charBtn2 .topCharPreview{
  width:26px;height:26px;position:relative;display:block;
  overflow:hidden;border-radius:50%;
}
#charBtn2 .topCharPreview .player{
  position:relative;width:26px;height:26px;display:block;
}
#charBtn2 .topCharPreview .player .body{
  width:26px;height:28px;left:0;top:0;
  filter:none;
}
#charBtn2 .topCharPreview .player .head{
  width:100%;height:94%;top:3%;left:0;
}
#charBtn2 .topCharPreview .player .torso{
  display:none;
}
#langBtn:active, #themeBtn:active, #charBtn2:active, #helpBtn:active{transform:translateY(1px);}
#topbar{
  width:100%;max-width:520px;
  padding:2px 14px 4px;
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  flex:0 0 auto;
}
#stageNav{display:flex;align-items:center;gap:6px;}
#stageNav button{
  font-family:inherit;color:var(--ink);
  background:var(--panel);border:2px solid var(--panelBorder);border-radius:8px;
  padding:5px 10px;font-size:13px;cursor:pointer;letter-spacing:1px;
}
#stageNav button:active{transform:translateY(1px);}
#prevStage,#nextStage{min-width:34px;font-size:14px;}
#stagePick{min-width:78px;color:var(--accent);border-color:var(--accent);}
#edBackBtn{
  display:none;z-index:30;font-family:inherit;font-size:13px;cursor:pointer;
  background:var(--accent);color:#10100c;border:none;border-radius:10px;
  padding:8px 14px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
#stagePick:disabled,#prevStage:disabled,#nextStage:disabled{opacity:.35;}
/* ============================================================
   モダンテーマ群(レトロUIはデフォルトの:rootで完全保持)
   body に theme-xxx クラスを付けて切り替える
   ============================================================ */

/* ---- テーマ3: 自然光 & 3D風(立体的・温かみ) ---- */
body.theme-natural{
  --cave:#3a3228; --cave2:#473d30; --ink:#f7efe0; --accent:#ffb454;
  --rune:#6fe0b0;
  --bodyBg: linear-gradient(170deg,#5a4d3a 0%, #2e271d 75%);
  --gameFont: 'Outfit','Quicksand',-apple-system,system-ui,sans-serif;
  --panel:#473d30; --panelBorder:#6b5a44;
  --boardBg: linear-gradient(160deg,#5c4f3c,#3e3527);
  --boardShadow: 0 2px 0 #2a2319, 0 20px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
  --floorGrad: linear-gradient(145deg,#d9c19a 0%,#c3a878 100%);
  --floorInset: inset 0 1px 0 rgba(255,255,255,.3), inset 0 -3px 5px rgba(0,0,0,.12);
  --wallGrad: linear-gradient(160deg,#7a6347,#5a4730);
  --wallShadow: inset 0 4px 0 rgba(255,255,255,.12), inset 0 -6px 8px rgba(0,0,0,.4), 0 3px 6px rgba(0,0,0,.3);
  --wallRadius:5px;
  --holeGrad: radial-gradient(circle at 50% 38%, #000 0%, #140d06 50%, #3a2a18 80%, #c3a878 100%);
  --goalGrad: radial-gradient(circle at 50% 40%, #3a6b5a, #25453a);
  --rockGrad: radial-gradient(circle at 33% 26%, #e8dcc8 0%, #b0a088 42%, #6b5d48 100%);
  --rockShadow: 0 6px 10px rgba(0,0,0,.45), inset -4px -6px 8px rgba(0,0,0,.25), inset 4px 5px 8px rgba(255,255,255,.35);
  --rockRadius:48%;
  --fillGrad: radial-gradient(circle at 38% 30%, #9a8a70, #6b5d48 70%);
  --headColor:#eab98c; --hatColor:#c85a3a; --eyeColor:#2b1c12;
  --torsoGrad: linear-gradient(#4a8270,#356152);
  --boardRadius:14px; --tileRadius:4px; --boardPad:5px; --tileGap:2px;
  --dimText:#a8957a; --stepText:#e0d2ba; --titleShadow:0 3px 4px rgba(0,0,0,.5);
}

/* ---- テーマ4: とにかく派手で爽快 ---- */
body.theme-vivid{
  --cave:#1a0b2e; --cave2:#2a1248; --ink:#fff6ff; --accent:#ffd000; --rune:#00ffa3;
  --bodyBg: linear-gradient(135deg,#ff2e88 0%, #8a2be2 40%, #1a0b2e 100%);
  --gameFont: 'Baloo 2','Fredoka',-apple-system,system-ui,sans-serif;
  --panel:#2a1248; --panelBorder:#ff2e88;
  --boardBg: linear-gradient(160deg,#3a1a5e,#1f0d38);
  --boardShadow: 0 0 0 3px #ff2e88, 0 0 0 6px #ffd000, 0 16px 44px rgba(255,46,136,.4);
  --floorGrad: linear-gradient(135deg,#5e3a8e,#46256e);
  --floorInset: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 2px 0 rgba(255,255,255,.18);
  --wallGrad: linear-gradient(160deg,#ff2e88,#b81e5e);
  --wallShadow: inset 0 3px 0 rgba(255,255,255,.3), inset 0 -4px 0 rgba(0,0,0,.2), 0 0 12px rgba(255,46,136,.5);
  --wallRadius:6px;
  --holeGrad: radial-gradient(circle at 50% 42%, #000 0%, #1a0b2e 55%, #46256e 90%);
  --goalGrad: radial-gradient(circle at 50% 50%, rgba(0,255,163,.3), #1f0d38);
  --rockGrad: radial-gradient(circle at 35% 28%, #fff 0%, #ffd000 40%, #ff8a00 100%);
  --rockShadow: 0 0 18px rgba(255,208,0,.7), inset -3px -4px 0 rgba(0,0,0,.2), inset 3px 4px 4px rgba(255,255,255,.6);
  --rockRadius:32%;
  --fillGrad: radial-gradient(circle at 38% 32%, #5e3a8e, #46256e 70%);
  --headColor:#ffd6a8; --hatColor:#00ffa3; --eyeColor:#2a1248;
  --torsoGrad: linear-gradient(#ffd000,#ff8a00);
  --boardRadius:16px; --tileRadius:7px; --boardPad:6px; --tileGap:3px;
  --dimText:#c89adf; --stepText:#ffd6f5; --titleShadow:0 0 14px rgba(255,208,0,.9),2px 2px 0 #ff2e88;
}
body.theme-vivid h1{text-shadow:0 0 14px rgba(255,208,0,.9),2px 2px 0 #ff2e88;}

/* ---- テーマ5: 森の絵本(やわらかい緑と木漏れ日) ---- */
body.theme-forest{
  --cave:#243225; --cave2:#31442f; --ink:#fff6dc; --accent:#f0c86a; --rune:#8be0a0;
  --bodyBg: radial-gradient(circle at 35% 0%, rgba(255,220,135,.22), transparent 34%), linear-gradient(180deg,#2f4a31,#172519 78%);
  --gameFont:'Baloo 2','Hiragino Sans',system-ui,sans-serif;
  --panel:#31442f; --panelBorder:#5e744d; --boardBg:#243225;
  --boardShadow:0 0 0 3px #142016,0 0 0 6px #5e744d,0 18px 42px rgba(0,0,0,.45);
  --floorGrad:linear-gradient(145deg,#d9c98f,#bba66a); --floorInset:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -3px 5px rgba(95,70,25,.18);
  --wallGrad:linear-gradient(160deg,#5d4a32,#3d3022); --wallShadow:inset 0 3px 0 rgba(255,255,255,.08), inset 0 -5px 0 rgba(0,0,0,.25);
  --wallRadius:8px; --holeGrad:radial-gradient(circle at 50% 42%,#0a0805 0%,#1b140b 58%,#5d4a32 100%);
  --goalGrad:radial-gradient(circle at 50% 50%,rgba(139,224,160,.35),#234837);
  --rockGrad:radial-gradient(circle at 35% 28%,#d9d0ba,#92866d 60%,#5d5548 100%);
  --rockShadow:0 5px 9px rgba(0,0,0,.36), inset -4px -5px 0 rgba(0,0,0,.18), inset 3px 4px 0 rgba(255,255,255,.24);
  --rockRadius:48%; --fillGrad:radial-gradient(circle at 38% 32%,#92866d,#5d5548 72%);
  --headColor:#ffd8ac; --hatColor:#7cb15b; --eyeColor:#2b1c12; --torsoGrad:linear-gradient(#7bb56b,#4d8245);
  --boardRadius:18px; --tileRadius:7px; --boardPad:6px; --tileGap:3px; --dimText:#9fb28d; --stepText:#f0dfb5; --titleShadow:0 3px 0 rgba(0,0,0,.35);
}

/* ---- テーマ7: 8ビットヒーロー(青いレトロSF) ---- */
body.theme-hero8{
  --cave:#071125; --cave2:#101f3d; --ink:#eaf6ff; --accent:#4ab4ff; --rune:#7cffd6;
  --bodyBg:linear-gradient(180deg,#10234b,#050914);
  --gameFont:'Orbitron','DotGothic16',system-ui,sans-serif;
  --panel:#101f3d; --panelBorder:#294c91; --boardBg:#081225;
  --boardShadow:0 0 0 2px #4ab4ff,0 0 0 5px #10234b,0 0 28px rgba(74,180,255,.25);
  --floorGrad:linear-gradient(135deg,#14346a,#0c2146); --floorInset:inset 0 0 0 1px rgba(124,255,214,.14);
  --wallGrad:linear-gradient(160deg,#275fbf,#173878); --wallShadow:inset 0 0 0 2px rgba(124,255,214,.25), inset 0 -4px 0 rgba(0,0,0,.28);
  --wallRadius:2px; --holeGrad:radial-gradient(circle at 50% 45%,#000,#051023 65%,#14346a 100%);
  --goalGrad:radial-gradient(circle at 50% 50%,rgba(124,255,214,.32),#071b2f);
  --rockGrad:radial-gradient(circle at 35% 28%,#d7f8ff,#4ab4ff 45%,#1252a2 100%);
  --rockShadow:0 0 12px rgba(74,180,255,.55), inset -3px -4px 0 rgba(0,0,0,.25), inset 3px 4px 0 rgba(255,255,255,.35);
  --rockRadius:22%; --fillGrad:radial-gradient(circle at 38% 32%,#173878,#0c2146 72%);
  --headColor:#d4e7ff; --hatColor:#4ab4ff; --eyeColor:#061225; --torsoGrad:linear-gradient(#4ab4ff,#173878);
  --boardRadius:6px; --tileRadius:2px; --boardPad:4px; --tileGap:2px; --dimText:#6282c5; --stepText:#9ec8ff; --titleShadow:0 0 10px rgba(74,180,255,.9);
}

/* ---- テーマ8: 和風庭園(石畳・苔・朱色) ---- */
body.theme-zen{
  --cave:#161a14; --cave2:#243022; --ink:#f7efd8; --accent:#d94b34; --rune:#8fd4b0;
  --bodyBg:radial-gradient(circle at 50% 0%,rgba(143,212,176,.16),transparent 34%),linear-gradient(180deg,#243022,#10140f);
  --gameFont:'DotGothic16','Hiragino Mincho ProN','Hiragino Sans',serif;
  --panel:#243022; --panelBorder:#516049; --boardBg:#192018;
  --boardShadow:0 0 0 3px #0b0f0b,0 0 0 6px #516049,0 18px 40px rgba(0,0,0,.5);
  --floorGrad:linear-gradient(145deg,#b8b09b,#918a78); --floorInset:inset 0 0 0 1px rgba(255,255,255,.12), inset 0 -3px 0 rgba(0,0,0,.12);
  --wallGrad:linear-gradient(160deg,#3d4938,#263122); --wallShadow:inset 0 3px 0 rgba(255,255,255,.06), inset 0 -5px 0 rgba(0,0,0,.3);
  --wallRadius:4px; --holeGrad:radial-gradient(circle at 50% 42%,#050605,#121810 62%,#918a78 100%);
  --goalGrad:radial-gradient(circle at 50% 50%,rgba(217,75,52,.22),#341816);
  --rockGrad:radial-gradient(circle at 35% 28%,#d7d0c2,#8d887e 58%,#4f4c48 100%);
  --rockShadow:0 5px 9px rgba(0,0,0,.42), inset -4px -5px 0 rgba(0,0,0,.22), inset 3px 4px 0 rgba(255,255,255,.2);
  --rockRadius:46%; --fillGrad:radial-gradient(circle at 38% 32%,#78736a,#4f4c48 72%);
  --headColor:#f1caa6; --hatColor:#d94b34; --eyeColor:#2b1c12; --torsoGrad:linear-gradient(#3f7b5b,#28533f);
  --boardRadius:12px; --tileRadius:3px; --boardPad:5px; --tileGap:2px; --dimText:#839178; --stepText:#d9ceb4; --titleShadow:0 2px 0 #000;
}

/* タイル間ギャップを演出(モダンテーマ向け)。JSは触らず、boxのinsetで隙間を作る */
body.theme-natural .tile, body.theme-vivid .tile,
body.theme-forest .tile, body.theme-hero8 .tile,
body.theme-zen .tile{
  outline:var(--tileGap) solid var(--boardBg);
  outline-offset:calc(var(--tileGap) * -1);
}

/* スムーズなテーマ遷移 */
body, #board, .tile, .ent .rock, button{
  transition: background-color .4s ease, color .4s ease, box-shadow .4s ease, border-color .4s ease;
}

/* キャラ選択モーダル */
#charPicker{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:30;padding:18px;
}
#charPicker.show{display:flex;}
#charBox{
  background:var(--panel);border:2px solid var(--panelBorder);border-radius:16px;
  width:100%;max-width:520px;max-height:86vh;overflow-y:auto;
  padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);
}
#charBox h3{
  font-weight:normal;font-size:16px;color:var(--accent);letter-spacing:1px;
  margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;
}
#charClose{
  font-family:inherit;background:var(--cave);color:var(--ink);
  border:2px solid var(--panelBorder);border-radius:8px;padding:4px 12px;font-size:14px;cursor:pointer;
}
#charGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.charCard{
  border:2px solid var(--panelBorder);border-radius:12px;padding:10px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;
  background:var(--cave);position:relative;min-height:96px;justify-content:center;
}
.charCard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
.charCard.locked{opacity:.55;}
.charCard .cName{font-size:12px;color:var(--ink);}
.charCard .cLock{font-size:10px;color:var(--dimText);line-height:1.3;text-align:center;}
.charCard .preview{width:52px;height:52px;position:relative;display:flex;align-items:center;justify-content:center;}
/* プレビュー内のミニキャラ(playerと同じ構造を縮小) */
.charCard .preview .player{position:relative;width:46px;height:46px;}
.charCard .preview .player .body{width:46px;height:46px;left:0;top:0;}

/* テーマ選択モーダル */
#themePicker{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:30;padding:18px;
}
#themePicker.show{display:flex;}
#themeBox{
  background:var(--panel);border:2px solid var(--panelBorder);border-radius:16px;
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);
}
#themeBox h3{
  font-weight:normal;font-size:16px;color:var(--accent);letter-spacing:1px;
  margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;
}
#themeClose{
  font-family:inherit;background:var(--cave);color:var(--ink);
  border:2px solid var(--panelBorder);border-radius:8px;padding:4px 12px;font-size:14px;cursor:pointer;
}
#themeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.themeCard{
  border:2px solid var(--panelBorder);border-radius:12px;padding:14px 12px;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;font-family:inherit;color:#fff;
  position:relative;overflow:hidden;min-height:84px;text-align:left;
  transition:transform .15s ease;
}
.themeCard:active{transform:scale(.97);}
.themeCard .tName{font-size:15px;font-weight:700;}
.themeCard .tDesc{font-size:11px;opacity:.85;line-height:1.4;}
.themeCard .swatch{display:flex;gap:4px;margin-top:auto;}
.themeCard .swatch i{width:16px;height:16px;border-radius:50%;display:block;}
.themeCard.sel{outline:3px solid #fff;outline-offset:1px;}
.themeCard .tCheck{position:absolute;top:8px;right:10px;font-size:14px;}
.tc-retro{background:linear-gradient(135deg,#2e211a,#221813);}
.tc-natural{background:linear-gradient(135deg,#5c4f3c,#2e271d);}
.tc-vivid{background:linear-gradient(135deg,#ff2e88,#8a2be2);}
.tc-forest{background:linear-gradient(135deg,#2f4a31,#172519);}
.tc-hero8{background:linear-gradient(135deg,#10234b,#050914);}
.tc-zen{background:linear-gradient(135deg,#243022,#10140f);}

/* あそびかた(ヘルプ) */
#helpPicker{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:30;padding:18px;
}
#helpPicker.show{display:flex;}
#helpBox{
  background:var(--panel);border:2px solid var(--panelBorder);border-radius:16px;
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);
}
#helpBox h3{
  font-weight:normal;font-size:16px;color:var(--accent);letter-spacing:1px;
  margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;
}
#helpBox h3 button{
  font-family:inherit;background:var(--cave);color:var(--ink);
  border:2px solid var(--panelBorder);border-radius:8px;padding:6px 12px;font-size:12px;
}
.helpSection{font-size:13px;color:var(--accent);letter-spacing:1px;margin:14px 0 2px;}
.helpItem{display:flex;gap:12px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--panelBorder);}
.helpItem:last-child{border-bottom:none;}
.hIcon{
  width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;
  font-size:24px;background:var(--cave);border:2px solid var(--panelBorder);border-radius:10px;
}
.hName{font-size:14px;font-weight:700;margin-bottom:3px;color:var(--ink);}
.hDesc{font-size:12px;line-height:1.65;color:var(--dimText);}
/* 刃アイコン: ゲーム内タイル(.tile.blade::before)と同じ描画のミニチュア */
.hIcon .hBlade{

#picker{

#myCourses{

}
#myCourses.show{display:flex;}

.courseItem .cPlay{background:var(--accent);color:#10100c;border-color:var(--accent);}

#myCoursesEmpty{color:var(--stepText);font-size:14px;text-align:center;padding:20px;}
.endlessStartBtn{

}

.editorStartBtn{

}

/* ===== チュートリアル ===== */
#tutorial{
  position:fixed;inset:0;z-index:50;display:none;
  align-items:flex-end;justify-content:center;padding:24px;
  background:rgba(0,0,0,.45);backdrop-filter:blur(2px);
}
#tutorial.show{display:flex;animation:tutFade .3s ease;}
@keyframes tutFade{from{opacity:0;}to{opacity:1;}}
#tutCard{
  background:var(--panel);border:2px solid var(--accent);border-radius:18px;
  max-width:420px;width:100%;padding:22px;text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
  margin-bottom:30px;
}
#tutIcon{font-size:44px;margin-bottom:8px;animation:tutBob 1.6s ease-in-out infinite;}
@keyframes tutBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
#tutText{color:var(--ink);font-size:15px;line-height:1.8;margin-bottom:16px;}
#tutBtns{display:flex;gap:10px;justify-content:center;}
#tutBtns button{
  font-family:inherit;border-radius:10px;padding:10px 20px;font-size:14px;cursor:pointer;
}
#tutSkip{background:var(--cave);color:var(--dimText);border:2px solid var(--panelBorder);}
#tutNext{background:linear-gradient(135deg,var(--accent),var(--rune));color:#10100c;border:none;font-weight:700;}
#tutDots{display:flex;gap:6px;justify-content:center;margin-top:14px;}
#tutDots i{width:7px;height:7px;border-radius:50%;background:var(--panelBorder);display:block;}
#tutDots i.on{background:var(--accent);}
#editor{
  position:fixed;inset:0;z-index:40;background:var(--bodyBg);
  display:none;flex-direction:column;align-items:center;
  padding:10px;gap:8px;overflow:hidden;
}
#editor.show{display:flex;}
#editorBar{
  width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;
  flex:0 0 auto;
}
#editorTitle{font-size:18px;color:var(--accent);letter-spacing:2px;}
#editorExit{
  font-family:inherit;background:var(--panel);color:var(--ink);
  border:2px solid var(--panelBorder);border-radius:8px;padding:5px 12px;font-size:13px;cursor:pointer;
}
#editorPalette{
  width:100%;max-width:520px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:0 0 auto;
}
.palBtn{
  font-family:inherit;background:var(--panel);color:var(--ink);
  border:2px solid var(--panelBorder);border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;
}
.palBtn.sel{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
#editorOpts{display:flex;gap:10px;flex:0 0 auto;align-items:center;justify-content:center;flex-wrap:wrap;}
.optSel{display:flex;align-items:center;gap:5px;color:var(--stepText);font-size:13px;}
.optSel select{
  font-family:inherit;background:var(--panel);color:var(--ink);
  border:2px solid var(--panelBorder);border-radius:8px;padding:5px 8px;font-size:14px;cursor:pointer;
}
#edBreakVal{min-width:20px;text-align:center;font-size:16px;color:var(--accent);}
#editorBoardWrap{flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px;}
#editorBoard{position:relative;background:var(--boardBg);border-radius:var(--boardRadius);box-shadow:var(--boardShadow);}
.eTile{position:absolute;box-sizing:border-box;border:1px solid rgba(0,0,0,.15);}
#editorMsg{font-size:13px;min-height:18px;text-align:center;flex:0 0 auto;color:var(--stepText);}
#editorMsg.ok{color:var(--rune);}
#editorMsg.ng{color:#ff6b6b;}
#editorActions{
  width:100%;max-width:520px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:0 0 auto;
}
#editorActions button{
  font-family:inherit;background:var(--panel);color:var(--ink);
  border:2px solid var(--panelBorder);border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;
}
#editorActions button:disabled{opacity:.4;}
#edShare:not(:disabled){background:linear-gradient(135deg,var(--accent),var(--rune));color:#10100c;border:none;font-weight:700;}
#edSaveRow{
  width:100%;max-width:520px;display:flex;gap:8px;justify-content:center;align-items:center;flex:0 0 auto;flex-wrap:wrap;
  margin-bottom:18px;padding:12px;background:var(--cave2);border:2px solid var(--accent);border-radius:12px;
}
#edNameInput{
  font-family:inherit;background:var(--cave2);color:var(--ink);
  border:2px solid var(--accent);border-radius:8px;padding:9px 12px;font-size:15px;flex:1 1 140px;min-width:0;max-width:220px;
}
#edSaveRow button{
  font-family:inherit;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;border:2px solid var(--panelBorder);
}
#edSaveConfirm{background:var(--accent);color:#10100c;border-color:var(--accent);font-weight:700;}
#edSaveCancel{background:var(--cave);color:var(--ink);}
.chip{
  aspect-ratio:1/1;border-radius:7px;
  background:var(--cave);border:2px solid var(--panelBorder);
  color:var(--dimText);font-family:inherit;font-size:15px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.chip.cur{border-color:var(--accent);color:var(--accent);}
.chip.done{color:var(--rune);border-color:#2d6b5d;}
.chip.done::after{content:'✓';font-size:10px;position:absolute;margin:18px 0 0 16px;}
.chip.perfect{border-color:var(--accent);}
.chip.perfect::after{content:'★';color:var(--accent);}
.chip.locked{
  opacity:.42;cursor:not-allowed;color:var(--dimText);
  filter:grayscale(.7);
}
.chip.locked::before{content:'🔒';font-size:13px;}
.chip.locked{font-size:0;}
#hud{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:90px;}
#steps{font-size:12px;color:var(--stepText);text-align:right;}
#bestRec{font-size:11px;color:var(--rune);text-align:right;min-height:13px;letter-spacing:.5px;}
#boardWrap{
  flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;
  padding:6px;min-height:0;
}
#board{
  position:relative;
  background:var(--boardBg);
  border-radius:var(--boardRadius);
  box-shadow:var(--boardShadow);
  padding:var(--boardPad);
  transition:background .4s, box-shadow .4s;
}
.tile{position:absolute;}
.tile.floor{
  background:var(--floorGrad);
  box-shadow:var(--floorInset);
  border-radius:var(--tileRadius);
}
.tile.floor.alt{filter:brightness(.95);}
.tile.wall{
  background:var(--wallGrad);
  box-shadow:var(--wallShadow);
  border-radius:var(--wallRadius);
}
.tile.hole{
  background:var(--holeGrad);
  box-shadow:inset 0 4px 8px #000;
  border-radius:var(--tileRadius);
}
.tile.filled{
  background:var(--floorGrad);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.13);
  border-radius:var(--tileRadius);
}
.tile.filled::after{
  content:'';position:absolute;inset:14%;
  border-radius:50%;
  background:var(--fillGrad);
  box-shadow:inset 0 -4px 6px rgba(0,0,0,.45), 0 0 0 3px rgba(0,0,0,.18);
  opacity:.9;
}
.tile.goal{
  background:var(--goalGrad);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.3);
  border-radius:var(--tileRadius);
}
/* ===== 刃(トゲ)のマス ===== */
.tile.blade{
  background:var(--floorGrad);
  box-shadow:var(--floorInset);
  border-radius:var(--tileRadius);
  overflow:hidden;
}
.tile.blade .spikes{
  position:absolute;inset:0;
  background:
    linear-gradient(135deg, transparent 46%, #9aa3ad 46% 54%, transparent 54%),
    linear-gradient(45deg, transparent 46%, #9aa3ad 46% 54%, transparent 54%);
}
.tile.blade::before{
  content:'';position:absolute;left:6%;right:6%;bottom:6%;height:46%;
  background:repeating-linear-gradient(90deg,
    #c7ced6 0, #c7ced6 8%, #8b949e 8%, #8b949e 16%);
  clip-path:polygon(0 100%,8% 0,16% 100%,24% 0,32% 100%,40% 0,48% 100%,56% 0,64% 100%,72% 0,80% 100%,88% 0,96% 100%,100% 60%,100% 100%);
  filter:drop-shadow(0 -1px 1px rgba(0,0,0,.4));
}
.tile.blade .spikes{ display:none; }
/* ===== 氷の床(滑るステージ) ===== */
#board.slideBoard .tile.floor,
#board.slideBoard .tile.filled{
  background:linear-gradient(135deg,#cdeefb 0%,#a6d8f0 50%,#bfe6f7 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), inset 0 -3px 6px rgba(120,170,200,.35);
}
#board.slideBoard .tile.floor.alt{ filter:brightness(.97); }
/* 氷の光沢(斜めのハイライト) */
#board.slideBoard .tile.floor::before{
  content:'';position:absolute;left:8%;top:8%;width:40%;height:18%;
  background:linear-gradient(120deg,rgba(255,255,255,.75),rgba(255,255,255,0));
  border-radius:50%;transform:rotate(-20deg);pointer-events:none;
}
#board.slideBoard .tile.hole{
  background:radial-gradient(circle at 50% 40%, #06314a 0%, #021824 80%);
  box-shadow:inset 0 4px 10px #000, inset 0 0 0 1px rgba(150,200,230,.3);
}
#board.slideBoard .tile.filled::after{
  background:linear-gradient(145deg,#8fc4e0,#5a93b8);
}
.tile.goal::after{
  content:'';position:absolute;inset:16%;
  border-radius:50%;
  border:3px dotted var(--rune);
  box-shadow:0 0 14px var(--rune), inset 0 0 10px rgba(86,224,195,.5);
  animation:runePulse 1.6s ease-in-out infinite;
}
@keyframes runePulse{
  0%,100%{transform:scale(1);opacity:.85;}
  50%{transform:scale(.86);opacity:1;}
}
.ent{
  position:absolute;left:0;top:0;
  transition:transform .13s cubic-bezier(.34,1.4,.64,1);
  will-change:transform;
  display:flex;align-items:center;justify-content:center;
}
.boulder{z-index:2;}
.boulder.sliding{ transition:transform .2s cubic-bezier(.4,.05,.55,1); }
.boulder .rock{
  width:86%;height:86%;border-radius:var(--rockRadius);
  background:var(--rockGrad);
  box-shadow:var(--rockShadow);
  position:relative;
  transition:transform .1s ease;
}
.boulder .rock::after{
  content:'';position:absolute;left:24%;top:40%;width:14%;height:14%;border-radius:50%;
  background:rgba(0,0,0,.22);
  box-shadow:160% -90% 0 -1px rgba(0,0,0,.2), 90% 120% 0 -2px rgba(0,0,0,.18);
}
/* 押された瞬間、岩が少しめり込む */
.boulder.pushed .rock{ animation:rockPush .16s ease; }
@keyframes rockPush{ 0%{transform:scale(1);} 45%{transform:scale(.88);} 100%{transform:scale(1);} }
/* 岩が壊れる: 砕けて消える */
.boulder.breaking .rock{ animation:rockCrumble .26s ease-in forwards; }
@keyframes rockCrumble{
  0%{ transform:scale(1) rotate(0); }
  25%{ transform:scale(1.08,.86) rotate(-3deg); }   /* ぐらっと潰れる */
  50%{ transform:scale(.92,1.04) rotate(3deg); }
  100%{ transform:scale(.55,.4) translateY(28%) rotate(8deg); opacity:0; filter:blur(1px); }
}
/* 砕けた破片 */
.shard{ position:absolute;background:var(--rockGrad);border-radius:2px;pointer-events:none;z-index:5; }
@keyframes shardFly{ 0%{opacity:1;} 100%{opacity:0;} }
/* 壊し残数インジケータ */
#breakInfo{ font-size:12px;color:var(--accent);letter-spacing:.5px; }
#breakInfo.flash{ animation:breakFlash .5s ease; }
@keyframes breakFlash{ 0%,100%{opacity:1;} 25%,75%{opacity:.3;} 50%{opacity:1;transform:scale(1.1);} }
/* 壊せるステージでは岩がタップ可能に見える */
.boulder{ cursor:pointer; }
.player{z-index:3;}
.player .body{
  width:74%;height:78%;position:relative;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.28)) drop-shadow(0 5px 6px rgba(0,0,0,.18));
}
.player .head{
  position:absolute;top:3%;left:0;transform:none;
  width:100%;height:88%;border-radius:50% 50% 46% 46%;
  background:var(--headColor);
  border:2.5px solid #1a1a1a;
  box-sizing:border-box;
  box-shadow:inset -2px -3px 0 rgba(95,45,18,.16), inset 2px 2px 0 rgba(255,255,255,.18);
  z-index:1;
}
.player .hat{
  position:absolute;top:-11%;left:-7%;width:114%;height:38%;
  background:linear-gradient(180deg,#d95a3f 0%,var(--hatColor) 62%,#8d2f24 100%);
  border-radius:52% 52% 22% 22%;
  border:2.5px solid #1a1a1a;box-sizing:border-box;z-index:2;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.22);
}
.player .eye{
  position:absolute;top:44%;width:14%;height:18%;background:#1a1a1a;border-radius:50%;
  transition:all .12s ease;z-index:3;
}
.player .eye.l{left:24%;}
.player .eye.r{right:24%;}
/* 眉(ふだんは隠れている。表情で出現) */
.player .brow{
  position:absolute;top:34%;width:18%;height:7%;background:#1a1a1a;border-radius:3px;
  opacity:0;transition:all .12s ease;z-index:3;
}
.player .brow.l{left:20%;}
.player .brow.r{right:20%;}
/* 口(ふだんは小さな点。表情で形が変わる) */
.player .mouthf{
  position:absolute;top:72%;left:50%;transform:translateX(-50%);
  width:14%;height:7%;background:#1a1a1a;border-radius:0 0 50% 50%;
  transition:all .12s ease;z-index:3;
}
.player .torso{
  display:none;
}

/* ===== 表情バリエーション(.player に face-xxx を付ける) ===== */
/* 押す・踏ん張り: ぐっと力む( >< ) */
.player.face-push .eye{ height:7%;width:17%; border-radius:2px; top:52%; }
.player.face-push .brow{ opacity:1; top:42%; }
.player.face-push .brow.l{ transform:rotate(22deg); }
.player.face-push .brow.r{ transform:rotate(-22deg); }
.player.face-push .mouthf{ width:13%;height:13%;border-radius:50%;top:72%; }
/* ぶつかる: 目を回す( @ @ ) */
.player.face-bump .eye{ width:22%;height:22%;border:3px solid #1a1a1a;background:transparent;border-radius:50%;top:46%; }
.player.face-bump .eye.l{left:20%;} .player.face-bump .eye.r{right:20%;}
.player.face-bump .mouthf{ width:18%;height:14%;border-radius:50%; }
/* 満足(穴を埋めた): にっこり( ^ ^ ) */
.player.face-happy .eye{ height:6%;width:16%;border-radius:3px;top:52%; }
.player.face-happy .mouthf{ width:34%;height:17%;border-radius:0 0 70% 70%;background:#1a1a1a; }
/* 歓喜(ゴール): キラキラ大喜び */
.player.face-win .eye{ width:17%;height:22%;border-radius:50%;top:46%; }
.player.face-win .mouthf{ width:40%;height:26%;border-radius:0 0 55% 55%;background:#1a1a1a; }
.player.face-win .body{ animation:winWiggle .5s ease infinite; }
@keyframes winWiggle{ 0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);} }
/* 不安(詰みかけ): 困り眉+口がへの字 */
.player.face-worry .brow{ opacity:1;top:38%;height:7%; }
.player.face-worry .brow.l{ transform:rotate(-24deg); }
.player.face-worry .brow.r{ transform:rotate(24deg); }
.player.face-worry .mouthf{ width:26%;height:13%;border-radius:50% 50% 0 0;top:80%; }
.player.face-worry .eye{ height:20%;width:16%; }

.player.bump{animation:bump .2s ease;}
@keyframes bump{
  0%,100%{margin-left:0;margin-top:0;}
  40%{margin-left:var(--bx,0px);margin-top:var(--by,0px);}
}
/* 歩くたびのちょっとした弾み */
.player.step .body{ animation:hop .14s ease; }
@keyframes hop{ 0%,100%{transform:translateY(0) scaleY(1);} 50%{transform:translateY(-8%) scaleY(1.05);} }

/* ===== キャラクター別の見た目(フラット&輪郭くっきり) ===== */
.player .head{ position:relative; }
.player .part{ position:absolute; }

/* --- 女の子: ぱっつん前髪 + 長い髪 + 明るい丸顔 --- */
.player.char-girl .body{ width:76%;height:80%; }
.player.char-girl .head{
  background:linear-gradient(180deg,#fff4e8 0%,#ffd9bf 100%);
  border-radius:50% 50% 48% 48%;
  width:88%;height:82%;top:10%;left:6%;transform:none;
  box-shadow:inset -2px -3px 0 rgba(220,130,85,.08), inset 2px 2px 0 rgba(255,255,255,.55);
  overflow:visible;
  z-index:3;
}
.player.char-girl .head::before{
  display:none;
}
.player.char-girl .head::after{
  content:'';position:absolute;left:12%;right:12%;top:60%;height:13%;
  background:
    radial-gradient(circle at 0 50%,rgba(255,142,160,.55) 0 42%,transparent 45%),
    radial-gradient(circle at 100% 50%,rgba(255,142,160,.55) 0 42%,transparent 45%);
  z-index:4;pointer-events:none;
}
.player.char-girl .hat{
  background:
    linear-gradient(90deg,#2c211e 0 16%,transparent 16% 84%,#2c211e 84% 100%),
    linear-gradient(180deg,#2c211e 0 34%,transparent 35%);
  height:108%;top:-9%;left:-7%;width:114%;
  border:none;border-radius:48% 48% 44% 44%;
  box-shadow:none;z-index:2;
}
.player.char-girl .hat::before{
  content:'';position:absolute;left:9%;right:9%;top:4%;height:24%;
  background:#2c211e;border-radius:50% 50% 18% 18%;
  z-index:2;

#controls{
  width:100%;max-width:520px;
  display:flex;flex-direction:column;align-items:center;
  padding:4px 14px 10px;gap:8px;
  flex:0 0 auto;
}
.btnRow{display:flex;flex-direction:row;gap:10px;justify-content:center;width:100%;max-width:340px;margin-top:18px;}
.btnRow button{
  flex:1 1 0;position:relative;
  display:flex;align-items:center;justify-content:center;
  height:46px;padding:0;border-radius:12px;
  font-size:22px;
}
.btnRow button .bIcon{ line-height:1; }
.btnRow button:disabled{ opacity:.35; }
.bBadge{
  position:absolute;top:-8px;right:-8px;
  background:#ff4d2e;color:#fff;
  font-size:13px;font-weight:900;min-width:22px;height:22px;
  border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;

}
#breakBtn.armed{ background:linear-gradient(135deg,#ff7a3a,#e0452a); border-color:#ff7a3a; }
.btnRow button.flash{ animation:breakFlash .5s ease; }
@keyframes breakFlash{ 0%,100%{opacity:1;} 25%,75%{opacity:.3;} 50%{opacity:1;transform:scale(1.12);} }
#soundBtn.muted{ opacity:.45; }
button{
  font-family:inherit;color:var(--ink);
  background:var(--panel);
  border:2px solid var(--panelBorder);border-radius:10px;
  padding:7px 12px;font-size:13px;letter-spacing:1px;cursor:pointer;
}
button:active{transform:translateY(2px);}
#dpad{
  display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);
  gap:5px;margin:0 auto;
}
#dpad button{
  font-size:20px;padding:0;border-radius:12px;
  background:var(--panel);border:2px solid var(--panelBorder);
}
#dpad .blank{visibility:hidden;}
#hint{display:none;}
#overlay{
  position:fixed;inset:0;background:rgba(10,6,3,.82);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  z-index:10;text-align:center;padding:20px;
}
#overlay.show{display:flex;}
#overlay h2{
  font-size:34px;font-weight:normal;letter-spacing:6px;color:var(--rune);
  text-shadow:0 0 18px rgba(86,224,195,.7);
}
#overlay p{color:#cdb592;font-size:14px;line-height:1.8;}
.statRow{
  display:flex;gap:10px;justify-content:center;margin-top:16px;
}
.stat{
  background:var(--cave2);border:2px solid #4a3729;border-radius:10px;
  padding:8px 14px;min-width:72px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.stat .statLabel{font-size:11px;color:#8d7458;letter-spacing:1px;}
.stat .statVal{font-size:22px;color:var(--ink);}
.stat.statPar{border-color:var(--accent);}
.stat.statPar .statVal{color:var(--accent);}
#overlay .row{display:flex;gap:10px;}
#overlay button{font-size:16px;padding:12px 20px;border-color:var(--accent);}
@media (max-height:760px){
  #dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;}
  h1{font-size:18px;}
  #controls{padding:2px 14px 6px;gap:6px;}
  .btnRow button{height:42px;font-size:20px;}
  .btnRow{margin-top:12px;}
}

<div id="picker">

    <h3><span id="pickerTitle">ステージをえらぶ</span> <button id="pickerClose">とじる</button></h3>
    <button id="endlessStart" class="endlessStartBtn">∞ エンドレスモード</button>
    <button id="editorStart" class="editorStartBtn">✏️ コースを作る</button>
    <button id="myCoursesStart" class="editorStartBtn">📁 マイコース</button>
    <div id="pickGrid"></div>
  </div>
</div>

<div id="myCourses">
  <div id="myCoursesBox">
    <h3><span id="myCoursesTitle">マイコース</span> <button id="myCoursesClose">とじる</button></h3>
    <div id="myCoursesList"></div>
  </div>
</div>

<div id="themePicker">
  <div id="themeBox">
    <h3><span id="themeTitle">テーマをえらぶ</span> <button id="themeClose">とじる</button></h3>
    <div id="themeGrid"></div>
  </div>
</div>

<div id="charPicker">
  <div id="charBox">
    <h3><span id="charTitle">キャラをえらぶ</span> <button id="charClose">とじる</button></h3>
    <div id="charGrid"></div>
  </div>
</div>

<div id="helpPicker">
  <div id="helpBox">
    <h3><span id="helpTitle">あそびかた</span> <button id="helpClose">とじる</button></h3>
    <div id="helpContent"></div>
  </div>
</div>

<div id="editor">
  <div id="editorBar">
    <span id="editorTitle">コースエディタ</span>
    <button id="editorExit">✕ とじる</button>
  </div>
  <div id="editorPalette">
    <button class="palBtn sel" data-tool="P">🧍 スタート</button>
    <button class="palBtn" data-tool="G">🚩 ゴール</button>
    <button class="palBtn" data-tool="#">🧱 壁</button>
    <button class="palBtn" data-tool="B">🪨 岩</button>
    <button class="palBtn" data-tool="O">🕳 穴</button>
    <button class="palBtn" data-tool=".">⬜ 床(消す)</button>
  </div>
  <div id="editorOpts">
    <label class="optSel"><span id="edWLabel">幅</span><select id="edWSel"></select></label>
    <label class="optSel"><span id="edHLabel">高さ</span><select id="edHSel"></select></label>
    <label class="optSel"><span id="edBreakLabel2">💥壊し</span><select id="edBreakSel"></select></label>
    <label class="optSel"><span id="edSlideLabel">❄️氷</span><select id="edSlideSel"><option value="0">OFF</option><option value="1">ON</option></select></label>
  </div>
  <div id="editorBoardWrap"><div id="editorBoard"></div></div>
  <div id="editorMsg"></div>
  <div id="edSaveRow" style="display:none;">
    <input id="edNameInput" type="text" maxlength="24" placeholder="コース名">
    <button id="edSaveConfirm">保存</button>
    <button id="edSaveCancel">やめる</button>
  </div>
  <div id="editorActions">
    <button id="edCheck">🔍 解けるかチェック</button>
    <button id="edSave" disabled>💾 保存</button>
    <button id="edShare" disabled>🔗 共有リンクを作る</button>
    <button id="edTest" disabled>▶ ためし遊び</button>
  </div>
</div>

function charUnlocked(c){ return cleared.size >= c.need; }

  const c = CHARACTERS.find(c=>c.id===character);
  return c ? c.cls : '';
}
// キャラ別の追加パーツHTML(共通のhead/hat/eye/torsoに差し込む)
function charPartsHTML(charId){
  switch(charId){
    case 'girl': return '';
    case 'cat':  return '<div class="part ear l"></div><div class="part ear r"></div><div class="part nose"></div><div class="part whisker l"></div><div class="part whisker r"></div><div class="part tail"></div>';
    case 'robot':return '<div class="part antenna"></div><div class="part mouth"></div><div class="part bolt l"></div><div class="part bolt r"></div>';
    case 'alien':return '';
    case 'king': return '<div class="part gem"></div><div class="part beard"></div><div class="part cape"></div>';
    default: return '';
  }
}
// プレイヤー駒のinnerHTML(キャラに応じてパーツを足す)
function playerInnerHTML(charId){
  return '<div class="body">'+charPartsHTML(charId)+'<div class="head"><div class="hat"></div><div class="brow l"></div><div class="brow r"></div><div class="eye l"></div><div class="eye r"></div><div class="mouthf"></div></div><div class="torso"></div></div>';
}
function updateCharButton(){
  const btn=document.getElementById('charBtn2');
  if(!btn) return;
  btn.innerHTML='<span class="topCharPreview"><span class="player '+charClass()+'">'+playerInnerHTML(character)+'</span></span>';
}

const STAGE_UNLOCK_GROUPS = [
  [0,19],
  [20,34],
  [35,49],
  [50,999]
];
function stageGroupIndex(i){
  return STAGE_UNLOCK_GROUPS.findIndex(([a,b])=>i>=a && i<=b);
}
function stageGroupCleared(groupIndex){
  const g=STAGE_UNLOCK_GROUPS[groupIndex];
  if(!g) return true;
  const end=Math.min(g[1], LEVELS.length-1);
  for(let i=g[0]; i<=end; i++){ if(!cleared.has(i)) return false; }
  return true;
}
function isStageUnlocked(i){
  return true; // TEMP: レベル確認用に全ステージ解放。確認後この行を削除して元に戻す
  const g=stageGroupIndex(i);
  if(g<=0) return true;
  for(let n=0; n<g; n++){ if(!stageGroupCleared(n)) return false; }
  return true;
}

let actx = null, sfxBus = null, ambGain = null, ambStarted = false;
function audio(){
  if(!actx){
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      // 効果音バス + 洞窟の残響(フィードバックディレイ)
      sfxBus = actx.createGain();
      const dry = actx.createGain(); dry.gain.value = 0.9;
      const dl = actx.createDelay(1.0); dl.delayTime.value = 0.26;
      const fb = actx.createGain(); fb.gain.value = 0.38;
      const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1600;
      const wet = actx.createGain(); wet.gain.value = 0.32;
      sfxBus.connect(dry).connect(actx.destination);
      sfxBus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl);
      lp.connect(wet); wet.connect(actx.destination);
      startAmbient();
    }catch(e){}
  }
  if(actx && actx.state==='suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, when){
  const a = audio(); if(!a || muted) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.06, a.currentTime+(when||0));
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+(when||0)+dur);
  o.connect(g).connect(sfxBus);
  o.start(a.currentTime+(when||0)); o.stop(a.currentTime+(when||0)+dur+0.02);
}

/* ---------- 洞窟の環境音:フロアごとに変化(すべてWebAudioで合成) ---------- */
let ambTier=-1, ambGen=0, ambTimers=[], ambNodes=[];

// フロア別パラメータ:第2フロアは低く・不協和に・速く
const TIERS=[
 { // フロア1(ステージ1-10) 静かな探検
   drone:[[55,1],[55.6,1],[110.3,0.25]], droneVol:0.05, dlpF:160,

 },
 { // フロア2(ステージ11-20) 深層:三全音のドローン+心拍

 },

 },
 { // 爆弾(破壊)ステージ: 火薬庫の緊張感。低音リフ+キックが脈打つ(リズムはシーケンサー側)
   drone:[[36.7,1],[37.3,1],[55,0.55],[73.4,0.3]], droneVol:0.06, dlpF:120,
   windF:180, windQ:2.2, windVol:0.02, windLfo:0.15,

 },
 { // 氷ステージ: 澄んだ高音の結晶世界。オルゴールの反復アルペジオが主役
   drone:[[110,1],[164.8,0.6],[220,0.35],[329.6,0.15]], droneVol:0.04, dlpF:900,

const TIER_BREAK=3, TIER_ICE=4;   // 上記の特殊ティアのインデックス
// 現在のステージに対応する環境音ティア(爆弾/氷は専用、通常はフロア進行)
function ambientTierForCur(){
  const L=LEVELS[cur];
  if(L && L.slide) return TIER_ICE;
  if(L && L.breaks) return TIER_BREAK;
  return Math.min(2, Math.floor(cur/10));
}
function ambientTierForEndless(){
  if(endlessData && endlessData.slide) return TIER_ICE;
  return Math.min(2, Math.floor(endlessLevel/6));
}

function stopAmbient(){
  ambGen++;
  ambTimers.forEach(clearTimeout); ambTimers=[];
  ambNodes.forEach(n=>{ try{n.stop&&n.stop();}catch(e){} try{n.disconnect();}catch(e){} });
  ambNodes=[];
  if(ambGain){ try{ambGain.disconnect();}catch(e){} ambGain=null; }
}
function setAmbientForLevel(){  if(!actx) return;
  const tier=ambientTierForCur();
  if(tier!==ambTier){ stopAmbient(); buildAmbient(tier); }
}
function setAmbientForEndless(){ if(!actx) return;
  const tier=ambientTierForEndless();
  if(tier!==ambTier){ stopAmbient(); buildAmbient(tier); }
}
function startAmbient(){ buildAmbient(endless ? ambientTierForEndless() : ambientTierForCur()); }

function buildAmbient(tier){
  if(!actx) return;
  ambTier=tier;
  const P=TIERS[tier];
  const icy=(tier===TIER_ICE);   // 氷ステージ専用の音色に差し替える
  const brk=(tier===TIER_BREAK); // 爆弾ステージ専用のビート
  const a=actx, gen=ambGen;
  const later=(fn,ms)=>{ const id=setTimeout(()=>{ if(gen===ambGen) fn(); },ms); ambTimers.push(id); };

  ambGain=a.createGain();
  ambGain.gain.value = bgmMuted?0:0.0001;
  ambGain.connect(a.destination);
  if(!bgmMuted){ // フェードイン
    ambGain.gain.setValueAtTime(0.0001,a.currentTime);
    ambGain.gain.linearRampToValueAtTime(1,a.currentTime+1.5);
  }

  // 深い残響
  const dl=a.createDelay(1.0); dl.delayTime.value=0.34;
  const fb=a.createGain(); fb.gain.value=0.45;
  const elp=a.createBiquadFilter(); elp.type='lowpass'; elp.frequency.value=1800;
  dl.connect(elp); elp.connect(fb); fb.connect(dl);
  const wet=a.createGain(); wet.gain.value=0.6;
  elp.connect(wet).connect(ambGain);
  ambNodes.push(dl,fb,elp,wet);

  // ドローン(フロア2は三全音=悪魔の音程を含む)
  const droneG=a.createGain(); droneG.gain.value=P.droneVol;
  const dlp=a.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=P.dlpF;
  P.drone.forEach(p=>{
    const o=a.createOscillator(); o.type='sine'; o.frequency.value=p[0];
    const g=a.createGain(); g.gain.value=p[1];
    o.connect(g).connect(dlp); o.start();
    ambNodes.push(o,g);
  });
  dlp.connect(droneG).connect(ambGain);
  const lfo=a.createOscillator(); lfo.frequency.value=0.05;
  const lfoG=a.createGain(); lfoG.gain.value=P.droneVol*0.4;
  lfo.connect(lfoG).connect(droneG.gain); lfo.start();
  ambNodes.push(droneG,dlp,lfo,lfoG);

  // 風
  const len=2*a.sampleRate;
  const buf=a.createBuffer(1,len,a.sampleRate);
  const ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
  const noise=a.createBufferSource(); noise.buffer=buf; noise.loop=true;
  const bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=P.windF; bp.Q.value=P.windQ;
  const windG=a.createGain(); windG.gain.value=P.windVol;
  noise.connect(bp).connect(windG).connect(ambGain); noise.start();
  const wlfo=a.createOscillator(); wlfo.frequency.value=P.windLfo;
  const wlfoG=a.createGain(); wlfoG.gain.value=170;
  wlfo.connect(wlfoG).connect(bp.frequency); wlfo.start();
  ambNodes.push(noise,bp,windG,wlfo,wlfoG);

  // 水滴(氷面では「ピキッ」という氷の軋みに差し替え)
  function drip(){
    if(!bgmMuted){
      const t=a.currentTime;
      if(icy){
        // 氷の軋み: 高域ノイズの破裂 + 下降するガラス質チャープ
        const nb=a.createBufferSource(); nb.buffer=buf; nb.loop=true;
        const hp=a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2600;
        const ng=a.createGain();
        ng.gain.setValueAtTime(0.0001,t);
        ng.gain.exponentialRampToValueAtTime(0.05,t+0.008);
        ng.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
        nb.connect(hp).connect(ng).connect(ambGain);
        nb.start(t); nb.stop(t+0.09);
        const o=a.createOscillator(); o.type='sine';
        const f=2400+Math.random()*1600;
        o.frequency.setValueAtTime(f,t);
        o.frequency.exponentialRampToValueAtTime(f*0.45,t+0.06);
        const g=a.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.05,t+0.006);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
        o.connect(g); g.connect(ambGain); g.connect(dl);
        o.start(t); o.stop(t+0.13);
      } else {
        const o=a.createOscillator(); o.type='sine';
        const f=900+Math.random()*900;
        o.frequency.setValueAtTime(f,t);
        o.frequency.exponentialRampToValueAtTime(f*0.4,t+0.09);
        const g=a.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.09,t+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
        o.connect(g); g.connect(ambGain); g.connect(dl);
        o.start(t); o.stop(t+0.2);
      }
    }
    later(drip, P.dripMin+Math.random()*P.dripRange);
  }
  if(!brk) later(drip,1000);   // 爆弾ステージでは水滴(鳥の囀りに聞こえる)を鳴らさない

  // 氷面のみ: キラキラの結晶アルペジオ(高音の粒が数個連なって降る)
  if(icy){
    function shimmer(){
      if(!bgmMuted){
        const t=a.currentTime;
        const n=3+Math.floor(Math.random()*4);      // 3〜6粒
        const dir=Math.random()<0.5?1:-1;           // 上昇/下降
        for(let k=0;k<n;k++){
          const f=P.scale[Math.floor(Math.random()*P.scale.length)]*(dir>0?(1+k*0.5):(3-k*0.5));
          const tt=t+k*0.085;
          const o=a.createOscillator(); o.type='sine'; o.frequency.value=Math.max(500,f);
          const g=a.createGain();
          g.gain.setValueAtTime(0.0001,tt);
          g.gain.exponentialRampToValueAtTime(0.028,tt+0.01);
          g.gain.exponentialRampToValueAtTime(0.0001,tt+0.5);
          o.connect(g); g.connect(ambGain); g.connect(dl);
          o.start(tt); o.stop(tt+0.55);
        }
      }
      later(shimmer, 4000+Math.random()*5000);
    }
    later(shimmer,2000);
  }

  // 神秘の音(フロア2は半音でぶつかる不穏な音階 / 氷面はガラスの鐘)
  function mysticNote(){
    if(!bgmMuted){
      const t=a.currentTime;
      const f=P.scale[Math.floor(Math.random()*P.scale.length)]*(Math.random()<0.3?2:1);
      if(icy){

        [[1,1],[2.76,0.4],[5.4,0.15]].forEach(([r,v])=>{
          const o=a.createOscillator(); o.type='sine'; o.frequency.value=f*r;
          const g=a.createGain();
          g.gain.setValueAtTime(0.0001,t);
          g.gain.exponentialRampToValueAtTime(P.noteVol*v,t+0.015);
          g.gain.exponentialRampToValueAtTime(0.0001,t+2.6);
          o.connect(g); g.connect(ambGain); g.connect(dl);
          o.start(t); o.stop(t+2.8);
        });
      } else {
        const o=a.createOscillator(); o.type='triangle'; o.frequency.value=f;
        const g=a.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(P.noteVol,t+0.6);
        g.gain.exponentialRampToValueAtTime(0.0001,t+3.2);
        o.connect(g); g.connect(ambGain); g.connect(dl);
        o.start(t); o.stop(t+3.4);
      }
    }
    later(mysticNote, P.noteEvery[0]+Math.random()*P.noteEvery[1]);
  }
  later(mysticNote,3000);

  // 岩鳴り
  function rumble(){
    if(!bgmMuted){
      const t=a.currentTime;
      const o=a.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(38,t);
      o.frequency.linearRampToValueAtTime(30,t+1.4);
      const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=90;
      const g=a.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(0.07,t+0.5);
      g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
      o.connect(fl).connect(g).connect(ambGain);
      o.start(t); o.stop(t+1.7);
    }
    later(rumble, P.rumble[0]+Math.random()*P.rumble[1]);
  }
  later(rumble,8000);

  // 心拍(フロア2のみ)。難易度=目安手数が高いほど速くなる
  if(P.heart){
    function thump(t,vol){
      const o=a.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(72,t);
      o.frequency.exponentialRampToValueAtTime(38,t+0.16);
      const g=a.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      o.connect(g).connect(ambGain);
      o.start(t); o.stop(t+0.25);
    }
    function heartbeat(){
      const curPar = endless ? (endlessData&&endlessData.par||60) : (LEVELS[cur].par||60);
      const bpm = 46 + Math.min(38, curPar/4);  // 例: 58手→60bpm, 146手→82bpm
      if(!bgmMuted){
        const t=a.currentTime;
        thump(t,0.16);          // ドクッ
        thump(t+0.30,0.10);     // …ン
      }
      later(heartbeat, 60000/bpm);
    }
    later(heartbeat,1500);
  }

  // 脳幹に刺さるビート: 爆弾=低音リフ+キック+ハット / 氷=オルゴールの反復アルペジオ+遠雷
  if(icy||brk){
    const bpm = brk?132:92;
    const stepDur = 60/bpm/2;            // 8分音符
    const pat = brk
      ? [110,110,220,110, 130.8,110,220,164.8, 110,110,220,110, 146.8,164.8,174.6,164.8]      // 唸るリフ(A-C-E + 半音上昇の煽り)
      : [659.3,784,987.8,1174.7, 1046.5,987.8,784,659.3, 659.3,784,987.8,1174.7, 1318.5,1174.7,987.8,784]; // オルゴール
    const acc = [1,.55,.85,.55, .95,.55,.85,.7, 1,.55,.85,.55, .95,.8,.9,.8];                 // アクセント(爆弾用)
    function kick(t,v){
      const o=a.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(110,t);
      o.frequency.exponentialRampToValueAtTime(36,t+0.12);
      const g=a.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(v,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
      o.connect(g).connect(ambGain);
      o.start(t); o.stop(t+0.32);
    }
    function tick(t){
      const nb=a.createBufferSource(); nb.buffer=buf; nb.loop=true;
      const hp=a.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=5000;
      const g=a.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.018,t+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
      nb.connect(hp).connect(g).connect(ambGain);
      nb.start(t); nb.stop(t+0.05);
    }
    function boom(t,v){
      // ボンッ: 丸く短い破裂音(音程が一気に落ちるサイン波 + 低いノイズの一吹き)
      const o=a.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(160,t);
      o.frequency.exponentialRampToValueAtTime(42,t+0.18);
      const g=a.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(v,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.connect(g); g.connect(ambGain); g.connect(dl);
      o.start(t); o.stop(t+0.4);
      const nb=a.createBufferSource(); nb.buffer=buf; nb.loop=true;
      const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
      const ng=a.createGain();
      ng.gain.setValueAtTime(0.0001,t);
      ng.gain.exponentialRampToValueAtTime(v*0.6,t+0.01);
      ng.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
      nb.connect(lp).connect(ng).connect(ambGain);
      nb.start(t); nb.stop(t+0.25);
    }
    function snare(t,v){
      const nb=a.createBufferSource(); nb.buffer=buf; nb.loop=true;
      const bp2=a.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=1900; bp2.Q.value=0.8;
      const g=a.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(v,t+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
      nb.connect(bp2).connect(g).connect(ambGain);
      nb.start(t); nb.stop(t+0.14);
    }
    function playStep(s,t){
      const f=pat[s%pat.length];
      if(brk){
        if(f){
          // 唸る歪み系ベース: ±6セントのデチューンsaw×2 + レゾナントフィルタの開閉
          const vA=acc[s%16];
          const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.Q.value=7;
          fl.frequency.setValueAtTime(300+1200*vA,t);
          fl.frequency.exponentialRampToValueAtTime(180,t+stepDur*0.85);
          const g=a.createGain();
          g.gain.setValueAtTime(0.0001,t);
          g.gain.exponentialRampToValueAtTime(0.05*vA,t+0.008);
          g.gain.exponentialRampToValueAtTime(0.0001,t+stepDur*0.95);
          [0.9965,1.0035].forEach(d=>{
            const o=a.createOscillator(); o.type='sawtooth'; o.frequency.value=f*d;
            o.connect(fl); o.start(t); o.stop(t+stepDur);
          });
          fl.connect(g).connect(ambGain);
        }
        if(s%2===1) tick(t);                          // 裏拍のハット
        if(s%8===4) snare(t,0.05);                    // 2・4拍のスネア
        if(s%32===0){ boom(t, s%64===0?0.22:0.14); }  // ボンッ(この拍はキックと重ねない)
        else if(s%4===0) kick(t, s%16===0?0.15:0.11); // 4つ打ちキック
      } else {
        if(f){
          [[1,0.032],[2.76,0.010]].forEach(([r,v])=>{   // 基音+ガラス質倍音
            const o=a.createOscillator(); o.type='sine'; o.frequency.value=f*r;
            const g=a.createGain();
            g.gain.setValueAtTime(0.0001,t);
            g.gain.exponentialRampToValueAtTime(v,t+0.008);
            g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
            o.connect(g); g.connect(ambGain); if(r===1)g.connect(dl);
            o.start(t); o.stop(t+0.6);
          });
        }
        if(s%32===0) kick(t,0.085);             // 2小節ごとの遠い低音
      }
    }
    // オーディオクロック先読みでリズムを正確に刻む(setTimeoutのゆらぎを排除)
    let seqStep=0, seqNext=a.currentTime+0.4;
    function seqLoop(){
      while(seqNext < a.currentTime+0.5){
        if(!bgmMuted) playStep(seqStep,seqNext);
        seqStep++; seqNext+=stepDur;
      }
      later(seqLoop,120);
    }
    later(seqLoop,200);
  }
}

/* ============================================================
   エンドレスモード:端末内で問題を生成→ソルバー検証→出題
   サーバー/DB不要。クリアするほど難易度が上がる。
   ============================================================ */
let endless = false;          // エンドレス中か
let endlessLevel = 0;         // 何問目か
let endlessData = null;       // 現在出題中の {map,par}
let endlessNext = null;       // 先読みで用意した次問
let endlessSeed = (Date.now()>>>0);
function erand(){ endlessSeed|=0; endlessSeed=endlessSeed+0x6D2B79F5|0; let t=Math.imul(endlessSeed^endlessSeed>>>15,1|endlessSeed); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }

// --- 端末内ソルバー(BFS, BigIntビットマスク) ---
function eSolveLen(grid, cap, breaks, slide){
  const H=grid.length, W=grid[0].length;
  breaks = breaks||0;
  slide = !!slide;
  let walls=0n, bm=0n, hm=0n, blades=0n, p=-1, goal=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=BigInt(y*W+x), c=grid[y][x];
    if(c==='#') walls|=1n<<i; else if(c==='B') bm|=1n<<i;
    else if(c==='O') hm|=1n<<i; else if(c==='X') blades|=1n<<i;
    else if(c==='P') p=y*W+x; else if(c==='G') goal=y*W+x;
  }
  const dirs=[-W,W,-1,1];
  cap=cap||200000;
  // 滑る方向に岩を進める。bl=現在の刃。戻り値 {dest, fell(穴), shattered(刃)} or null
  function slideRock(np, dd, b, h, bl){
    let cur=np;
    while(true){
      const nxt=cur+dd;
      if(nxt<0||nxt>=W*H) break;
      if(dd===-1 && cur%W===0) break;
      if(dd===1 && cur%W===W-1) break;
      const nb=1n<<BigInt(nxt);
      if(walls&nb) break;
      if(b&nb) break;
      if(nxt===goal) break;
      if(bl&nb){ return {dest:nxt, shattered:true}; }
      if(h&nb){ return {dest:nxt, fell:true}; }
      cur=nxt;
    }
    if(cur===np) return null;
    return {dest:cur, fell:false};
  }
  const dist=new Map();
  dist.set(p+'|'+bm+'|'+hm+'|'+breaks+'|'+blades, 0);
  let deque=[[p,bm,hm,breaks,blades,0]];
  while(deque.length){
    const a=deque.shift(); const pp=a[0],b=a[1],h=a[2],k=a[3],bl=a[4],d=a[5];
    if(dist.get(pp+'|'+b+'|'+h+'|'+k+'|'+bl)<d) continue;
    if(pp===goal) return d;
    for(const dd of dirs){
      const np=pp+dd;
      if(np<0||np>=W*H) continue;
      if(dd===-1 && pp%W===0) continue;
      if(dd===1 && pp%W===W-1) continue;
      const bit=1n<<BigInt(np);
      if(walls&bit) continue;
      if(bl&bit) continue;        // プレイヤーは(残っている)刃に進めない
      // 破壊(コスト0)
      if((b&bit) && k>0){
        const nb2=b&~bit;
        const key2=pp+'|'+nb2+'|'+h+'|'+(k-1)+'|'+bl;
        if(!dist.has(key2) || dist.get(key2)>d){
          dist.set(key2,d); deque.unshift([pp,nb2,h,k-1,bl,d]);
        }
      }
      if(h&bit) continue;
      let nb=b, nh=h, nbl=bl;
      if(b&bit){
        if(slide){
          const r=slideRock(np, dd, b, h, bl);
          if(!r) continue;
          const bb=1n<<BigInt(r.dest);
          if(r.shattered){ nb=b&~bit; }             // 岩だけが砕け、刃は残る
          else if(r.fell){ nb=b&~bit; nh=h&~bb; }
          else { nb=(b&~bit)|bb; }
        } else {
          const nbp=np+dd;
          if(nbp<0||nbp>=W*H) continue;
          if(dd===-1 && np%W===0) continue;
          if(dd===1 && np%W===W-1) continue;
          const bb=1n<<BigInt(nbp);
          if((walls&bb)||(b&bb)||nbp===goal) continue;
          if(bl&bb){ nb=b&~bit; }              // 岩だけが砕け、刃は残る
          else if(h&bb){ nb=b&~bit; nh=h&~bb; } else nb=(b&~bit)|bb;
        }
      }
      const key=np+'|'+nb+'|'+nh+'|'+k+'|'+nbl;
      if(!dist.has(key) || dist.get(key)>d+1){
        dist.set(key,d+1); deque.push([np,nb,nh,k,nbl,d+1]);
      }
    }
    if(dist.size>cap) return -1;
  }
  return null;
}
function eFirstPushes(grid){
  const H=grid.length,W=grid[0].length;
  const walls=new Set(),B=new Set(),O=new Set(); let p=null,goal=null;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];
    if(c==='#')walls.add(x+','+y);else if(c==='B')B.add(x+','+y);
    else if(c==='O')O.add(x+','+y);else if(c==='P')p=[x,y];else if(c==='G')goal=[x,y];}
  const dirs=[[0,-1],[0,1],[-1,0],[1,0]];
  const seen=new Set([p[0]+','+p[1]]); let q=[p],head=0;
  while(head<q.length){const c=q[head++],cx=c[0],cy=c[1];
    for(const dd of dirs){const nx=cx+dd[0],ny=cy+dd[1],k=nx+','+ny;
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      if(walls.has(k)||O.has(k)||B.has(k)||seen.has(k))continue;
      seen.add(k);q.push([nx,ny]);}}
  let count=0;
  for(const pos of seen){const pr=pos.split(',').map(Number),px=pr[0],py=pr[1];
    for(const dd of dirs){const tx=px+dd[0],ty=py+dd[1];
      if(!B.has(tx+','+ty))continue;
      const bx=tx+dd[0],by=ty+dd[1],bk=bx+','+by;
      if(bx<0||by<0||bx>=W||by>=H)continue;
      if(walls.has(bk)||B.has(bk)||(goal[0]===bx&&goal[1]===by))continue;
      count++;}}
  return count;
}
function eGenBoard(W,H,nw,nb,nh){
  const cells=[];for(let x=1;x<W-1;x++)for(let y=1;y<H-1;y++)cells.push([x,y]);
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(erand()*(i+1));const t=cells[i];cells[i]=cells[j];cells[j]=t;}
  if(nw+nb+nh+2>cells.length)return null;
  const g=[];for(let y=0;y<H;y++){const row=[];for(let x=0;x<W;x++)row.push((y===0||y===H-1||x===0||x===W-1)?'#':'.');g.push(row);}
  let k=0;
  for(let i=0;i<nw;i++){const c=cells[k++];g[c[1]][c[0]]='#';}
  for(let i=0;i<nb;i++){const c=cells[k++];g[c[1]][c[0]]='B';}
  for(let i=0;i<nh;i++){const c=cells[k++];g[c[1]][c[0]]='O';}
  const pp=cells[k++];g[pp[1]][pp[0]]='P';
  const gg=cells[k++];g[gg[1]][gg[0]]='G';
  return g.map(r=>r.join(''));
}
function eMutate(lv){
  const g=lv.map(r=>r.split('')); const H=g.length,W=g[0].length;
  const inner=[];for(let x=1;x<W-1;x++)for(let y=1;y<H-1;y++)inner.push([x,y]);
  const cells=ch=>inner.filter(c=>g[c[1]][c[0]]===ch);
  const pick=a=>a[Math.floor(erand()*a.length)];
  const move=(from)=>{const a=cells(from),f=cells('.');if(!a.length||!f.length)return false;const s=pick(a),t=pick(f);g[s[1]][s[0]]='.';g[t[1]][t[0]]=from;return true;};
  const op=erand();
  if(op<0.30){const c=pick(inner);if(g[c[1]][c[0]]==='#')g[c[1]][c[0]]='.';else if(g[c[1]][c[0]]==='.')g[c[1]][c[0]]='#';else return null;}
  else if(op<0.55){if(!move('B'))return null;}
  else if(op<0.78){if(!move('O'))return null;}
  else if(op<0.88){const f=cells('.');if(f.length<2)return null;const a=pick(f),b=pick(f);if(a===b)return null;g[a[1]][a[0]]='B';g[b[1]][b[0]]='O';}
  else if(op<0.94){if(!move('P'))return null;}
  else {if(!move('G'))return null;}
  return g.map(r=>r.join(''));
}
// 問題番号 n から目標手数帯を決める(徐々に難化)
function endlessTargetRange(n){
  const lo = 12 + n*5;          // 1問目12〜, 増加幅を少し大きく
  const hi = lo + 18;           // 帯を広めにして生成成功率を確保
  return [Math.min(lo,120), Math.min(hi,155)];
}
function endlessGenerate(n, budgetMs){
  budgetMs=budgetMs||2200;
  const range=endlessTargetRange(n), targetMin=range[0], targetMax=range[1];
  const slide = erand() < 0.35;   // 一定確率で氷ステージ(岩が滑る)を生成
  const t0=Date.now();
  let base=null;
  while(Date.now()-t0<budgetMs*0.4){
    const W=8+Math.floor(erand()*3),H=7+Math.floor(erand()*2);
    const styles=[[8,3,2],[5,4,4],[1,4,8]];
    const st=styles[Math.floor(erand()*styles.length)];
    const lv=eGenBoard(W,H,st[0],st[1],st[2]);
    if(!lv)continue;
    const L=eSolveLen(lv.map(r=>r.split('')),120000,0,slide);
    if(L!==null&&L!==-1&&L>=12){base={map:lv,par:L};break;}
  }
  if(!base)return null;
  const okQ=lv=>eFirstPushes(lv.map(r=>r.split('')))>=3;
  if(base.par>=targetMin&&base.par<=targetMax&&okQ(base.map))return {map:base.map,par:base.par,slide};
  let cur=base, best=base;
  while(Date.now()-t0<budgetMs){
    const cand=eMutate(cur.map);
    if(!cand)continue;
    const L=eSolveLen(cand.map(r=>r.split('')),200000,0,slide);
    if(L===null||L===-1)continue;
    if(L>cur.par||(L===cur.par&&erand()<0.3)){
      cur={map:cand,par:L};
      if(L>=targetMin&&L<=targetMax&&okQ(cand)){best=cur;break;}
      if(L>best.par)best=cur;
    }
  }
  return {map:best.map, par:best.par, slide};
}
// 先読み:次の問題をアイドル時間に用意
function prefetchEndless(){
  if(endlessNext) return;
  const gen=()=>{ endlessNext = endlessGenerate(endlessLevel+1, 2200); };
  if(window.requestIdleCallback) requestIdleCallback(gen,{timeout:1500});
  else setTimeout(gen, 300);
}

function loadLevel(i){
  if(!isStageUnlocked(i)) return;
  endless = false;
  cur = i; steps = 0; history = []; busy=false; won=false;
  breaksLeft = LEVELS[i].breaks || 0; breakMode=false;
  slideMode = !!LEVELS[i].slide;
  overlay.classList.remove('show');
  renderBoard(LEVELS[i].map);
  stageNameEl.textContent = levelName(cur);
  setAmbientForLevel();
  updateHUD(); renderChips(); updateBreakUI();
}
// エンドレス問題を読み込む(data = {map,par})。なければ生成。
function loadEndless(data){
  endless = true;
  steps = 0; history = []; busy=false; won=false;
  overlay.classList.remove('show');
  if(!data){ data = endlessGenerate(endlessLevel+1, 2200); }
  if(!data){ // 万一生成失敗時は易しめで再挑戦
    data = endlessGenerate(0, 3000) || {map:LEVELS[0].map.slice(), par:LEVELS[0].par};
  }
  endlessLevel++;
  endlessData = data;
  endlessNext = null;
  breaksLeft = data.breaks || 0; breakMode=false; slideMode=!!data.slide;
  renderBoard(data.map);
  stageNameEl.textContent = TX().endlessStage(endlessLevel);
  setAmbientForEndless();
  updateHUD(); renderChips(); updateBreakUI();
  prefetchEndless();
}
function startEndless(){
  endlessLevel = 0;
  endlessSeed = (Date.now()>>>0);
  endlessNext = null;
  loadEndless(null);
}

const LEVEL_URL_ENC = {'#':'w','.':'f','B':'b','O':'o','P':'p','G':'g','X':'x'};
const LEVEL_URL_DEC = {w:'#',f:'.',b:'B',o:'O',p:'P',g:'G',x:'X'};
function encodeLevel(mapRows, breaks, slide){
  const W=mapRows[0].length, H=mapRows.length;
  const flat=mapRows.join('').split('').map(ch=>LEVEL_URL_ENC[ch]||ch).join('');
  let s='lvl='+W+'x'+H+':'+flat;
  if(breaks && breaks>0) s+=':b'+breaks;
  if(slide) s+=':s1';
  return s;
}
function decodeLevel(hash){
  // hash例: "lvl=9x7:#####..." / "#lvl=9x7:...:b2" / "...:s1"
  let src=hash||'';
  try{ src=decodeURIComponent(src); }catch(e){}
  const m=/lvl=(\d+)x(\d+):([#.BOPGXwfbopgx]+)((?::b\d+)?(?::s1)?)/.exec(src);
  if(!m) return null;
  const W=+m[1], H=+m[2], flat=m[3].split('').map(ch=>LEVEL_URL_DEC[ch]||ch).join('');
  const opts=m[4]||'';
  const bm=/:b(\d+)/.exec(opts); const breaks = bm ? +bm[1] : 0;
  const slide = /:s1/.test(opts);
  if(flat.length!==W*H) return null;
  const rows=[];
  for(let y=0;y<H;y++) rows.push(flat.slice(y*W,(y+1)*W));
  const all=rows.join('');
  if((all.split('P').length-1)!==1 || (all.split('G').length-1)!==1) return null;
  return { rows, breaks, slide };
}
// 共有コースを「エンドレスの1問」として読み込む。解けなければ false
function loadShared(rows, breaks, slide){
  breaks = breaks||0; slide=!!slide;
  const L = eSolveLen(rows.map(r=>r.split('')), 3000000, breaks, slide);
  if(L===null || L===-1) return false;   // 解けない/重すぎる
  endless = true; sharedMode = true;
  endlessLevel = 1;
  steps=0; history=[]; busy=false; won=false;
  breaksLeft = breaks; breakMode=false; slideMode=slide;
  overlay.classList.remove('show');
  endlessData = { map:rows.slice(), par:L, breaks:breaks, slide:slide };
  endlessNext = null;
  renderBoard(endlessData.map);
  stageNameEl.textContent = TX().sharedStage();
  setAmbientForEndless();
  updateHUD(); renderChips(); updateBreakUI();
  return true;
}
// 起動時にURLの#lvl=を検出して共有コースを起動
function checkSharedURL(){
  const h = location.hash || '';
  if(h.indexOf('lvl=')<0) return false;
  const dec = decodeLevel(h);
  if(!dec){ alert(TX().badLink); return false; }
  audio();
  if(!loadShared(dec.rows, dec.breaks, dec.slide)){ alert(TX().unsolvable); return false; }
  return true;
}

  for(let y=0;y<edH;y++)for(let x=0;x<edW;x++){

function edPaint(x,y){
  // 外周は壁固定(編集不可)
  if(x===0||y===0||x===edW-1||y===edH-1) return;
  if(edTool==='P'){ // スタートは1つだけ
    for(let yy=0;yy<edH;yy++)for(let xx=0;xx<edW;xx++) if(edGrid[yy][xx]==='P') edGrid[yy][xx]='.';
  }
  if(edTool==='G'){ for(let yy=0;yy<edH;yy++)for(let xx=0;xx<edW;xx++) if(edGrid[yy][xx]==='G') edGrid[yy][xx]='.'; }
  edGrid[y][x]=edTool;
  edValid=null; setShareEnabled(false);
  editorMsgEl.textContent=''; editorMsgEl.className='';

function setShareEnabled(on){
  document.getElementById('edShare').disabled=!on;

}
function edCheck(){
  const rows=edRows(), all=rows.join('');
  const t=TX();
  if((all.split('P').length-1)!==1){ editorMsgEl.textContent=t.edNeedStart; editorMsgEl.className='ng'; return; }
  if((all.split('G').length-1)!==1){ editorMsgEl.textContent=t.edNeedGoal; editorMsgEl.className='ng'; return; }
  editorMsgEl.textContent=t.edChecking; editorMsgEl.className='';
  setTimeout(()=>{
    const L=eSolveLen(rows.map(r=>r.split('')), 3000000, edBreaks, edSlide);
    if(L===null){ editorMsgEl.textContent=t.edNoSolution; editorMsgEl.className='ng'; setShareEnabled(false); edValid=null; return; }
    if(L===-1){ editorMsgEl.textContent=t.edTooHard; editorMsgEl.className='ng'; setShareEnabled(false); edValid=null; return; }
    // 壊し回数が設定されている場合、その回数を「ちゃんと使わないと解けない」か確認
    if(edBreaks>0){
      const without=eSolveLen(rows.map(r=>r.split('')), 3000000, 0, edSlide);
      if(without!==null && without!==-1){
        // 壊さなくても解けてしまう → 壊し必須の設計になっていない(警告するが共有は許可)
        editorMsgEl.textContent=t.edSolvableNoBreak(L); editorMsgEl.className='ok';
        setShareEnabled(true); edValid={map:rows.slice(),par:L,breaks:edBreaks,slide:edSlide};
        return;
      }
    }
    editorMsgEl.textContent=t.edSolvable(L); editorMsgEl.className='ok';
    setShareEnabled(true); edValid={map:rows.slice(),par:L,breaks:edBreaks,slide:edSlide};
  }, 30);
}
function edShare(){
  if(!edValid) return;
  // どこで作ってもリンクは公開Web版を指す(アプリ内のcapacitor://等は他人が開けないため)
  const url=SHARE_BASE+'#'+encodeLevel(edValid.map, edValid.breaks, edValid.slide);
  const t=TX();
  const done=()=>{ editorMsgEl.textContent=t.edCopied; editorMsgEl.className='ok'; };
  if(navigator.share){
    navigator.share({title:'イワオシ', text:t.edShareText, url}).then(done).catch(()=>{copyText(url,done);});
  }else{ copyText(url,done); }
}
function copyText(text, cb){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(cb).catch(()=>fallbackCopy(text,cb));
  }else fallbackCopy(text,cb);
}
function fallbackCopy(text, cb){
  try{
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta); cb();
  }catch(e){ prompt('URL', text); }
}

// 岩オブジェクトを壊す(隣接&残回数チェック)
function tryBreakBoulder(b){
  if(busy||won) return;
  if(breaksLeft<=0) return;
  // プレイヤーが上下左右に隣接しているか
  const adj = (Math.abs(b.x-player.x)+Math.abs(b.y-player.y))===1;
  if(!adj){ flashBreakHint(); return; }
  audio();
  snapshot();
  breaksLeft--;
  breakMode=false;
  sfx.brk();
  spawnShards(b.x, b.y);   // 崩れた破片を飛散
  b.el.classList.add('breaking');
  busy=true;
  const tgt=b;
  setTimeout(()=>{
    tgt.el.remove();
    boulders=boulders.filter(o=>o!==tgt);
    busy=false;
  },260);
  setFace('face-push');
  updateBreakUI(); updateHUD();
}
// 岩が砕けた破片を飛ばす
function spawnShards(x,y){
  const n=6;
  const cx=x*T+T/2, cy=y*T+T/2;
  for(let i=0;i<n;i++){
    const s=document.createElement('div');
    s.className='shard';
    const sz=Math.max(4,Math.floor(T*0.16));
    s.style.width=sz+'px'; s.style.height=sz+'px';
    s.style.left=(cx-sz/2)+'px'; s.style.top=(cy-sz/2)+'px';
    board.appendChild(s);
    const ang=(Math.PI*2*i/n)+Math.random()*0.6;
    const dist=T*(0.4+Math.random()*0.5);
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist - T*0.2;
    s.animate([
      {transform:'translate(0,0) rotate(0)', opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*360}deg)`, opacity:0}
    ], {duration:300+Math.random()*120, easing:'cubic-bezier(.3,.7,.5,1)'});
    setTimeout(()=>s.remove(), 440);
  }
}

  history.push({

    breaks: breaksLeft,
    bs:boulders.map(b=>[b.x,b.y]),
    filled:[].concat(...grid.map((row,y)=>row.map((c,x)=>c===FILLED?[x,y]:null).filter(Boolean))),
    blades:[].concat(...grid.map((row,y)=>row.map((c,x)=>c===BLADE?[x,y]:null).filter(Boolean)))
  });
  if(history.length>200) history.shift();
}
// 表情を一時的に付ける(ms後に通常へ戻す)。win等は持続。
const FACE_CLASSES=['face-push','face-bump','face-happy','face-win','face-worry'];
let faceTimer=null;
function setFace(face, hold){
  if(!player||!player.el) return;
  FACE_CLASSES.forEach(f=>player.el.classList.remove(f));
  if(faceTimer){ clearTimeout(faceTimer); faceTimer=null; }
  if(face){
    player.el.classList.add(face);
    if(!hold){ faceTimer=setTimeout(()=>{ if(player&&player.el) player.el.classList.remove(face); }, 600); }
  }
}
function tryMove(dx,dy){
  if(busy||won||!player.el) return;
  audio();
  // 壊すモード中: 隣に岩があれば壊す。なければモード解除
  if(breakMode){
    breakMode=false; updateBreakUI();
    const tx=player.x+dx, ty=player.y+dy;
    const tb=boulderAt(tx,ty);
    if(tb){ tryBreakBoulder(tb); return; }
    return;
  }
  const nx=player.x+dx, ny=player.y+dy;
  if(nx<0||ny<0||nx>=W||ny>=H) return bumpAnim(dx,dy);
  const t = grid[ny][nx];
  if(t===WALL || t===HOLE || t===BLADE) return bumpAnim(dx,dy);  // 刃には進めない

  const b = boulderAt(nx,ny);
  if(b){
    let bx, by, bt, shattered=false;
    if(slideMode){
      // 岩は壁/別の岩/盤端/ゴールの手前まで滑る。穴があれば落ちて埋まる。刃に達したら砕ける。
      let cx=nx, cy=ny, fell=false;
      while(true){
        const tx=cx+dx, ty=cy+dy;
        if(tx<0||ty<0||tx>=W||ty>=H) break;
        const tt=grid[ty][tx];
        if(tt===WALL||tt===GOAL) break;
        if(boulderAt(tx,ty)) break;
        if(tt===BLADE){ cx=tx; cy=ty; shattered=true; break; }
        if(tt===HOLE){ cx=tx; cy=ty; fell=true; break; }
        cx=tx; cy=ty;
      }
      if(cx===nx && cy===ny) return bumpAnim(dx,dy); // 1マスも動けない
      bx=cx; by=cy; bt=shattered?BLADE:(fell?HOLE:grid[by][bx]);
    } else {
      bx=nx+dx; by=ny+dy;
      if(bx<0||by<0||bx>=W||by>=H) return bumpAnim(dx,dy);
      bt = grid[by][bx];
      if(bt===WALL || bt===GOAL || boulderAt(bx,by)) return bumpAnim(dx,dy);
      if(bt===BLADE) shattered=true;
    }
    snapshot();
    busy=true;
    if(slideMode){ b.el.classList.add('sliding'); setTimeout(()=>b.el.classList.remove('sliding'),220); }
    b.x=bx; b.y=by; place(b.el,bx,by);
    b.el.classList.remove('pushed'); void b.el.offsetWidth; b.el.classList.add('pushed');
    movePlayer(nx,ny,true);
    if(shattered){
      // 刃に当たって砕ける: 岩だけが消え、刃は残る(道は開かない)
      sfx.brk();
      spawnShards(bx,by);
      b.el.classList.add('breaking');
      const tgt=b;
      setTimeout(()=>{
        tgt.el.remove();
        boulders=boulders.filter(o=>o!==tgt);
        busy=false;
      }, slideMode?240:200);
      setFace('face-bump');   // 岩を失って困惑
    } else if(bt===HOLE){
      sfx.fall();
      b.el.remove();
      boulders = boulders.filter(o=>o!==b);
      setTile(bx,by,FILLED);
      setFace('face-happy');   // 穴を埋めて満足げ
      setTimeout(()=>busy=false,slideMode?200:130);
    } else {
      sfx.push();
      setFace('face-push');    // 押して踏ん張り顔
      setTimeout(()=>busy=false,slideMode?200:130);
    }
  } else {
    snapshot();
    sfx.step();
    movePlayer(nx,ny);
  }
}
function movePlayer(nx,ny,pushing){
  player.x=nx; player.y=ny;
  place(player.el,nx,ny);
  if(!pushing){ player.el.classList.remove('step'); void player.el.offsetWidth; player.el.classList.add('step'); }
  steps++; updateHUD();
  if(grid[ny][nx]===GOAL){
    won=true;
    sfx.goal();
    setFace('face-win', true);   // ゴールで歓喜(持続)
    board.classList.remove('cleared'); void board.offsetWidth; board.classList.add('cleared');
    setTimeout(showWin,300);
  }
}
function bumpAnim(dx,dy){
  sfx.bump();
  setFace('face-bump');   // ぶつかって目を回す
  player.el.style.setProperty('--bx',(dx*5)+'px');
  player.el.style.setProperty('--by',(dy*5)+'px');
  player.el.classList.remove('bump');
  void player.el.offsetWidth;
  player.el.classList.add('bump');
}
function undo(){
  if(won||busy) return;
  const s = history.pop();
  if(!s) return;
  // rebuild filled tiles: reset any FILLED not in snapshot back to HOLE, and apply snapshot fills
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(grid[y][x]===FILLED && !s.filled.some(f=>f[0]===x&&f[1]===y)) setTile(x,y,HOLE);
  }
  s.filled.forEach(f=>{ if(grid[f[1]][f[0]]!==FILLED) setTile(f[0],f[1],FILLED); });
  // 刃マスを復元: snapshot時に刃だった位置を刃に戻す
  if(s.blades){
    s.blades.forEach(f=>{ if(grid[f[1]][f[0]]!==BLADE) setTile(f[0],f[1],BLADE); });
  }
  // boulders
  boulders.forEach(b=>b.el.remove());
  boulders=[];
  s.bs.forEach(p=>addBoulder(p[0],p[1]));
  player.x=s.px; player.y=s.py; place(player.el,s.px,s.py);
  if(typeof s.breaks==='number') breaksLeft=s.breaks;
  breakMode=false;
  steps=Math.max(0,steps-1); updateHUD(); updateBreakUI();
  sfx.step();
}

function showWin(){
  sfx.win();

    endlessData.cleared = true;
    const pr = endlessData.par;
    const prevBest = (endlessLevel in endlessBest) ? endlessBest[endlessLevel] : Infinity;
    const best = Math.min(prevBest, steps);
    endlessBest[endlessLevel] = best;
    const isPerfect = (steps === pr);
    ovTitle.textContent = isPerfect ? t.perfectClear : t.clear;
    if(sharedMode){
      ovText.innerHTML = (isPerfect ? t.winSharedP(steps) : t.winShared(steps)) + statsBlock(steps, best, pr)
                       + (WEB_LOCKED ? t.webAppPromo : '');
      ovNext.textContent = edTestMode ? t.editorBack : (WEB_LOCKED ? t.webRetry : t.toEndless);
    }else{
      ovText.innerHTML = (isPerfect ? t.winEndlessP(endlessLevel, steps) : t.winEndless(endlessLevel, steps))
                       + statsBlock(steps, best, pr);
      ovNext.textContent = t.nextEndless;
    }
    saveProgress();
    renderChips(); updateHUD();
    overlay.classList.add('show');
    return;
  }
  cleared.add(cur);
  const pr = LEVELS[cur].par;
  const prevBest = (cur in bestSteps) ? bestSteps[cur] : Infinity;
  const best = Math.min(prevBest, steps);
  bestSteps[cur] = best;

  if(last && cleared.size===LEVELS.length){
    ovTitle.textContent=t.allClear;

                     + statsBlock(steps, best, pr);
    ovNext.textContent = last ? t.toFirst : (isStageUnlocked(cur+1) ? t.next : t.pickerTitle);
  }
  saveProgress();
  renderChips();
  updateHUD();
  overlay.classList.add('show');
}
